name: r53 workflow YAML diagnostic

on:
  push:
    branches:
      - experiment/r53-mips32-crypto-path
    paths:
      - ".github/workflows/passwall-ssh-core-openwrt24-mipsel-vm.yml"
      - ".github/workflows/r53-yaml-diagnostic.yml"

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse r53 SDK/QEMU workflow
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/passwall-ssh-core-openwrt24-mipsel-vm.yml"); puts "PASS: workflow YAML syntax"'
