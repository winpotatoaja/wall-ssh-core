name: R65-A vs R65-B Datapacket Bandwidth Benchmark (MT7621 QEMU)

on:
  push:
    branches:
      - experiment/r65-ab-benchmark
    paths:
      - ".github/r65-ab-benchmark.trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: r65-ab-datapacket-bandwidth-qemu
  cancel-in-progress: false

env:
  R65A_RUN_ID: "45917988440"
  R65A_SOURCE_SHA: "c419f4576bc46e7f8b30ff56ecbfcce71d00a1e"
  R65B_RUN_ID: "45921040962"
  R65B_SOURCE_SHA: "dc0454d93a93afc94e8024f6346b54eb3ccd07d7"

jobs:
  bandwidth-ab:
    name: Matched R65-A / R65-B Datapacket 100 MB A/B
    runs-on: ubuntu-26.04
    timeout-minutes: 130
    steps:
      - name: Checkout benchmark and analysis tools
        uses: actions/checkout@v4
        with:
          ref: experiment/r65-ab-benchmark
          sparse-checkout: |
            tests/qemu_speedtest_r65_ab.sh
            tests/diag_timer.c
            tests/analyze_qemu_speedtest_r65_ab.py
          sparse-checkout-cone-mode: false

      - name: Self-test monotonic sampler and analyzer
        shell: bash
        run: |
          set -euo pipefail
          sh -n tests/qemu_speedtest_r65_ab.sh
          python3 -m py_compile tests/analyze_qemu_speedtest_r65_ab.py
          gcc -std=c11 -Os -Wall -Wextra -Werror tests/diag_timer.c -o "$RUNNER_TEMP/diag-timer-native"
          DIAG_TIMER="$RUNNER_TEMP/diag-timer-native" sh tests/qemu_speedtest_r65_ab.sh --self-test

      - name: Install QEMU host requirements
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip zstd python3 openssh-client openssh-server \
            socat mtd-utils gdisk wget ca-certificates binutils file gawk

      - name: Download exact R65-A SDK artifact from Actions #897
        uses: actions/download-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-24.10.7-mipsel-r65-ipk
          run-id: ${{ env.R65A_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-r65a

      - name: Download exact R65-B SDK artifact from Actions #901
        uses: actions/download-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-24.10.7-mipsel-r65-ipk
          run-id: ${{ env.R65B_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-r65b

      - name: Verify both exact R65 package artifacts and source provenance
        shell: bash
        run: |
          set -euo pipefail
          for LABEL in r65a r65b; do
            DIR="package-$LABEL"
            CORE_IPK="$(find "$DIR" -maxdepth 1 -type f -name 'passwall-ssh-core_1.0.0-r65_mipsel_24kc.ipk' -print -quit)"
            LIBSSH2_IPK="$(find "$DIR" -maxdepth 1 -type f -name 'libssh2-1_1.11.1-r1_mipsel_24kc.ipk' -print -quit)"
            test -n "$CORE_IPK"
            test -n "$LIBSSH2_IPK"
            CORE_CONTROL="$(tar -xOzf "$CORE_IPK" ./control.tar.gz | tar -xzO ./control)"
            printf '%s\n' "$CORE_CONTROL" | grep -Fq 'Package: passwall-ssh-core'
            printf '%s\n' "$CORE_CONTROL" | grep -Fq 'Version: 1.0.0-r65'
            printf '%s\n' "$CORE_CONTROL" | grep -Fq 'Architecture: mipsel_24kc'
            LIBSSH2_CONTROL="$(tar -xOzf "$LIBSSH2_IPK" ./control.tar.gz | tar -xzO ./control)"
            printf '%s\n' "$LIBSSH2_CONTROL" | grep -Fq 'Package: libssh2-1'
            printf '%s\n' "$LIBSSH2_CONTROL" | grep -Fq 'Version: 1.11.1-r1'
            printf '%s\n' "$LIBSSH2_CONTROL" | grep -Fq 'Architecture: mipsel_24kc'
            test -s "$DIR/ipk.sha256"
            (cd "$DIR" && sha256sum -c ipk.sha256)
            ACTUAL_SHA="$(tr -d '\r\n' < "$DIR/build-source.sha")"
            if [ "$LABEL" = r65a ]; then EXPECTED_SHA="$R65A_SOURCE_SHA"; else EXPECTED_SHA="$R65B_SOURCE_SHA"; fi
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            test -s "$DIR/diag-timer"
            (cd "$DIR" && sha256sum -c diag-timer.sha256)
            readelf -h "$DIR/diag-timer" | grep -q MIPS
            echo "PASS: $LABEL exact source SHA $ACTUAL_SHA; core/libssh2 IPKs and MIPS diag timer verified."
          done
          chmod 0755 package-r65a/diag-timer package-r65b/diag-timer

      - name: Prepare MT7621 QEMU firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/stavultras/router-emulator/releases/download/v4.1/Router-Emulator-4.1-linux-x86_64.tar.gz \
            -o /tmp/router-emulator.tar.gz
          echo "8ae277cc0fecfb99da3a452fb4226f272ee6d571f362898ca2176513f3adb0b7  /tmp/router-emulator.tar.gz" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/stavultras/router-emulator/releases/download/v4.1/Router-Emulator-4.1-presets.zip \
            -o /tmp/router-emulator-presets.zip
          echo "8146b505a9d75407c4504bf90638d7e3d3e3ccfc529d09c45a40b2b6868604a2  /tmp/router-emulator-presets.zip" | sha256sum -c -
          tar -xzf /tmp/router-emulator.tar.gz -C emulator
          EMU_DIR="$(find emulator -maxdepth 3 -type f -name emulator.sh -print -quit | xargs dirname)"
          test -n "$EMU_DIR"
          unzip -q /tmp/router-emulator-presets.zip -d "$EMU_DIR"
          if [ -d "$EMU_DIR/Router-Emulator/presets" ]; then
            mkdir -p "$EMU_DIR/presets"
            cp -a "$EMU_DIR/Router-Emulator/presets/." "$EMU_DIR/presets/"
          fi
          QEMU_MIPSEL="$EMU_DIR/qemu/qemu-system-mipsel"
          if [ ! -x "$QEMU_MIPSEL" ]; then
            echo "Missing executable QEMU MIPS binary: $QEMU_MIPSEL"
            ls -la "$EMU_DIR/qemu" 2>&1 || true
            false
          fi
          "$QEMU_MIPSEL" --version
          if "$QEMU_MIPSEL" -M help > /tmp/mips-qemu-machines.txt 2>/tmp/mips-qemu-machines.err; then
            echo "QEMU machine help succeeded."
          else
            QEMU_RC=$?
            echo "QEMU machine help failed with status $QEMU_RC"
            cat /tmp/mips-qemu-machines.err
            cat /tmp/mips-qemu-machines.txt
            false
          fi
          cat /tmp/mips-qemu-machines.txt
          if ! grep -qi 'mt7621-router' /tmp/mips-qemu-machines.txt; then
            echo "QEMU binary does not advertise the MT7621 machine."
            false
          fi
          PRESET_FILE="$EMU_DIR/presets/zbtlink-zbt-wg3526-16m.ini"
          if [ ! -f "$PRESET_FILE" ]; then
            echo "ZBT-WG3526-16M preset not found in downloaded preset archive."
            find "$EMU_DIR" -maxdepth 4 -type f -iname '*wg3526*' -print
            false
          fi
          echo "Preset file: $PRESET_FILE"
          EMU_DIR="$(readlink -f "$EMU_DIR")"
          echo "EMU_DIR=$EMU_DIR" >> "$GITHUB_ENV"

          IB_BASE="https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621"
          IB_FILE="openwrt-imagebuilder-24.10.7-ramips-mt7621.Linux-x86_64.tar.zst"
          curl -fL --retry 3 --connect-timeout 20 --max-time 1200 "$IB_BASE/$IB_FILE" -o /tmp/openwrt-imagebuilder.tar.zst
          echo "19f321d10a78a8ca768b934243789c6b45c003374618a3c0aa51c06e06553fcc  /tmp/openwrt-imagebuilder.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/openwrt-imagebuilder.tar.zst
          IB_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-24.10.7-ramips-mt7621*' -print -quit)"
          test -n "$IB_DIR"
          IB_DIR="$(readlink -f "$IB_DIR")"
          test -f "$IB_DIR/Makefile"
          test -f "$IB_DIR/rules.mk"
          echo "ImageBuilder rules.mk found."
          echo "IB_DIR=$IB_DIR" >> "$GITHUB_ENV"

          # ImageBuilder's checksum manifest is not consumed by the QEMU test.
          # Keep calculating it, but do not let that ancillary target prevent
          # use of a firmware image that is subsequently checked below.
          python3 - "$IB_DIR/Makefile" <<'PY'
          from pathlib import Path
          import sys

          makefile = Path(sys.argv[1])
          content = makefile.read_text()
          original = "\t$(MAKE) -s checksum\n"
          replacement = "\t$(MAKE) -s checksum || echo 'WARNING: ImageBuilder checksum manifest failed; validating firmware image directly for QEMU'\n"
          if content.count(original) == 1:
              makefile.write_text(content.replace(original, replacement))
              print("ImageBuilder checksum target made non-fatal for this QEMU-only workflow.")
          else:
              print("Could not uniquely locate ImageBuilder checksum target.")
          PY
          if ! grep -Fq "checksum || echo 'WARNING: ImageBuilder checksum manifest failed" "$IB_DIR/Makefile"; then
            echo "ImageBuilder checksum hook patch was not applied."
            false
          fi

          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/mips-vm-key"
          FILES_DIR="$RUNNER_TEMP/mips-image-files"
          mkdir -p "$FILES_DIR/etc/dropbear" "$FILES_DIR/root/.ssh"
          install -m 0600 "$RUNNER_TEMP/mips-vm-key.pub" "$FILES_DIR/etc/dropbear/authorized_keys"
          install -m 0600 "$RUNNER_TEMP/mips-vm-key.pub" "$FILES_DIR/root/.ssh/authorized_keys"
          cd "$IB_DIR"
          make image PROFILE="zbtlink_zbt-wg3526-16m" PACKAGES="curl libopenssl libssh2" FILES="$FILES_DIR"
          echo "ImageBuilder completed; available firmware images:"
          find bin/targets/ramips/mt7621 -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          SYSUP="$(find bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)"
          if [ -z "$SYSUP" ]; then
            echo "No sysupgrade image was produced by ImageBuilder."
            find bin/targets/ramips/mt7621 -maxdepth 2 -type f -print
            false
          fi
          SYSUP="$(readlink -f "$SYSUP")"
          test -s "$SYSUP"
          echo "Selected firmware image: $SYSUP"
          sha256sum "$SYSUP"

          cd "$EMU_DIR"
          BASE="https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621"
          UBOOT_REL="u-boot-mt7621_zbtlink_zbt-wg3526-16m/u-boot-mt7621.bin"
          mkdir -p "$EMU_DIR/firmware/24.10.7/$(dirname "$UBOOT_REL")"
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 \
            "$BASE/$UBOOT_REL" \
            -o "$EMU_DIR/firmware/24.10.7/$UBOOT_REL"
          test -s "$EMU_DIR/firmware/24.10.7/$UBOOT_REL"
          echo "U-Boot image downloaded successfully."
          FLASH_DIR="$EMU_DIR/nor-zbt-wg3526-16m"
          python3 "$EMU_DIR/tools/mknand.py" --prefix mt7621 nor -o "$FLASH_DIR" \
            --size-mb 16 \
            --parts "u-boot:0x30000,u-boot-env:0x10000,factory:0x10000,firmware:-" \
            --bl2 "$EMU_DIR/firmware/24.10.7/$UBOOT_REL" \
            --sysupgrade "$SYSUP" \
            --mac-part factory --mac-off 0xe000 --mac 80:af:ca:11:22:33
          test -s "$FLASH_DIR/mt7621.mtd0.u-boot.bin"
          test -s "$FLASH_DIR/mt7621.mtd3.firmware.bin"
          echo "R65-A/R65-B packages and MT7621A QEMU firmware are ready."

      - name: Start algorithm-pinned SSH endpoints
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash sshcore-ci
          echo 'sshcore-ci:OpenWrt-CI-SSH-Only-2026' | sudo chpasswd
          sudo ssh-keygen -A
          sudo install -d -m 0755 -o root -g root /run/sshd

          start_sshd() {
            LABEL="$1"; PORT="$2"; CIPHERS="$3"; MACS="$4"
            sudo /usr/sbin/sshd -t -f /dev/null \
              -o HostKey=/etc/ssh/ssh_host_ed25519_key \
              -o "Ciphers=$CIPHERS" -o "MACs=$MACS"
            sudo /usr/sbin/sshd -D -e -f /dev/null \
              -p "$PORT" \
              -o "PidFile=/tmp/mips-sshd-$LABEL.pid" \
              -o HostKey=/etc/ssh/ssh_host_ed25519_key \
              -o ListenAddress=0.0.0.0 \
              -o PasswordAuthentication=yes \
              -o KbdInteractiveAuthentication=no \
              -o PubkeyAuthentication=no \
              -o PermitRootLogin=no \
              -o UsePAM=no \
              -o StrictModes=no \
              -o AllowUsers=sshcore-ci \
              -o AllowTcpForwarding=yes \
              -o PermitOpen=any \
              -o MaxSessions=64 \
              -o MaxAuthTries=3 \
              -o LogLevel=VERBOSE \
              -o "Ciphers=$CIPHERS" \
              -o "MACs=$MACS" > "/tmp/mips-sshd-$LABEL.log" 2>&1 &
            echo "$!" >> "$RUNNER_TEMP/mips-sshd-pids"
            for attempt in $(seq 1 30); do
              if timeout 2 bash -c "</dev/tcp/127.0.0.1/$PORT" 2>/dev/null; then
                echo "PASS: $LABEL SSH endpoint port=$PORT Ciphers=$CIPHERS MACs=$MACS"
                return 0
              fi
              sleep 1
            done
            cat "/tmp/mips-sshd-$LABEL.log"
            return 1
          }

          : > "$RUNNER_TEMP/mips-sshd-pids"
          start_sshd chacha 2222 'chacha20-poly1305@openssh.com' 'hmac-sha2-256'
          start_sshd hmac 2223 'aes128-ctr' 'hmac-sha2-256'
          start_sshd etm 2224 'aes128-ctr' 'hmac-sha2-256-etm@openssh.com'

      - name: Boot one MT7621 guest and run R65-A/R65-B ABBA benchmarks
        shell: bash
        timeout-minutes: 85
        run: |
          set -euo pipefail
          cd "$EMU_DIR"
          mkdir -p work
          setsid ./emulator.sh -P zbtlink-zbt-wg3526-16m -w user -l user \
            -o "lan-forwards=8022:22" -u none \
            -S work/mips-console.sock -L work/logs >work/mips-emulator.log 2>&1 &
          EMU_PID=$!
          echo "$EMU_PID" > "$GITHUB_WORKSPACE/mips-emulator.pid"
          SSH_KEY="$RUNNER_TEMP/mips-vm-key"
          SSH_OPTS=(-i "$SSH_KEY" -p 8022 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          READY=0
          for attempt in $(seq 1 360); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then cat work/mips-emulator.log; false; fi
            if ssh "${SSH_OPTS[@]}" -o ConnectTimeout=5 root@127.0.0.1 'echo MIPS_GUEST_READY' 2>/dev/null | grep -q MIPS_GUEST_READY; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1
          ssh "${SSH_OPTS[@]}" root@127.0.0.1 'mkdir -p /tmp/mips-test/package-r65a /tmp/mips-test/package-r65b'
          scp -O -i "$SSH_KEY" -P 8022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r \
            "$GITHUB_WORKSPACE/package-r65a" "$GITHUB_WORKSPACE/package-r65b" \
            "$GITHUB_WORKSPACE/tests/qemu_speedtest_r65_ab.sh" \
            root@127.0.0.1:/tmp/mips-test/
          ssh "${SSH_OPTS[@]}" root@127.0.0.1 \
            'cp /tmp/mips-test/package-r65a/diag-timer /tmp/mips-test/diag-timer && chmod 0700 /tmp/mips-test/diag-timer'
          ssh "${SSH_OPTS[@]}" root@127.0.0.1 \
            'chmod 0700 /tmp/mips-test/package-r65a/diag-timer /tmp/mips-test/qemu_speedtest_r65_ab.sh && DIAG_TIMER=/tmp/mips-test/package-r65a/diag-timer sh /tmp/mips-test/qemu_speedtest_r65_ab.sh --self-test'

          echo "profile variant repeat kind rc" > "$GITHUB_WORKSPACE/benchmark-status.txt"
          run_variant() {
            LABEL="$1"; PROFILE="$2"; REPEAT="$3"; KIND="$4"
            case "$PROFILE" in
              chacha)
                PORT=2222; EXPECT_CIPHER='chacha20-poly1305@openssh.com'; EXPECT_MAC=''
                ;;
              nonetm)
                PORT=2223; EXPECT_CIPHER='aes128-ctr'; EXPECT_MAC='hmac-sha2-256'
                ;;
              etm)
                PORT=2224; EXPECT_CIPHER='aes128-ctr'; EXPECT_MAC='hmac-sha2-256-etm@openssh.com'
                ;;
              *) echo "Unknown profile: $PROFILE"; return 2 ;;
            esac
            if [ "$KIND" = profile ]; then
              PERF_LOG=1
              RESULT_NAME="qemu-speedtest-$PROFILE-$LABEL-profile"
            else
              PERF_LOG=0
              RESULT_NAME="qemu-speedtest-$PROFILE-$LABEL-rep$REPEAT"
            fi
            if [ "$LABEL" = a ]; then PACKAGE_DIR=package-r65a; else PACKAGE_DIR=package-r65b; fi

            cat > "$RUNNER_TEMP/tcp.env" <<TCP_ENV
          TRANSPORT=TCP
          HOST=10.0.2.2
          HOST_PORT=$PORT
          USERNAME=sshcore-ci
          PASSWORD=OpenWrt-CI-SSH-Only-2026
          DELAY=0
          FIX_CRLF=1
          SOCKS_ADDR=127.0.0.1:1080
          KEEPALIVE=15
          VERIFY_TLS=0
          MAX_CLIENTS=32
          IDLE_TIMEOUT=600
          WORKERS=2
          LOG_BACKPRESSURE=1
          TCP_ENV

            scp -O -i "$SSH_KEY" -P 8022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$RUNNER_TEMP/tcp.env" root@127.0.0.1:/tmp/mips-test/tcp.env

            RC=0
            ssh "${SSH_OPTS[@]}" root@127.0.0.1 \
              "set -e; opkg --force-reinstall --force-downgrade install /tmp/mips-test/$PACKAGE_DIR/libssh2-1_1.11.1-r1_mipsel_24kc.ipk; grep -aFq 'libssh2_session_diag_timing_snapshot' /usr/lib/libssh2.so.1; opkg --force-reinstall --force-downgrade install /tmp/mips-test/$PACKAGE_DIR/passwall-ssh-core_1.0.0-r65_mipsel_24kc.ipk; RESULT_NAME='$RESULT_NAME' PROFILE_NAME='$PROFILE' VARIANT='$LABEL' RUN_KIND='$KIND' PERF_LOG='$PERF_LOG' EXPECTED_CIPHER='$EXPECT_CIPHER' EXPECTED_MAC='$EXPECT_MAC' TRANSFER_TIMEOUT=50 PROFILE_TIMEOUT=12 sh /tmp/mips-test/qemu_speedtest_r65_ab.sh" \
              || RC=$?
            echo "$PROFILE $LABEL $REPEAT $KIND $RC" | tee -a "$GITHUB_WORKSPACE/benchmark-status.txt"
            return 0
          }

          # Each throughput profile uses ABBA order: A1, B1, B2, A2.
          # Direct and one-session SOCKS5 100 MB transfers are paired within each run.
          for PROFILE in chacha nonetm etm; do
            run_variant a "$PROFILE" 1 throughput
            run_variant b "$PROFILE" 1 throughput
            run_variant b "$PROFILE" 2 throughput
            run_variant a "$PROFILE" 2 throughput
          done

          # Separate short profiling sessions use LOG_PERF=1; never part of throughput stats.
          run_variant a nonetm 0 profile
          run_variant b nonetm 0 profile
          run_variant a etm 0 profile
          run_variant b etm 0 profile

      - name: Collect R65 A/B benchmark logs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p bandwidth-results
          if [ -f "$RUNNER_TEMP/mips-vm-key" ]; then
            SSH_KEY="$RUNNER_TEMP/mips-vm-key"
            ssh -i "$SSH_KEY" -p 8022 -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@127.0.0.1 \
              'cd /tmp/mips-test && find . -maxdepth 1 -type d -name "qemu-speedtest-*" -print > /tmp/r65-bench-dirs.txt && test -s /tmp/r65-bench-dirs.txt && tar -czf /tmp/r65-ab-results.tgz -T /tmp/r65-bench-dirs.txt' 2>/dev/null
            scp -O -i "$SSH_KEY" -P 8022 -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              root@127.0.0.1:/tmp/r65-ab-results.tgz bandwidth-results/ 2>/dev/null
            if [ -s bandwidth-results/r65-ab-results.tgz ]; then
              tar -xzf bandwidth-results/r65-ab-results.tgz -C bandwidth-results
            fi
          fi
          for LABEL in chacha hmac etm; do
            cp "/tmp/mips-sshd-$LABEL.log" "bandwidth-results/host-sshd-$LABEL.log" 2>/dev/null
          done
          cat bandwidth-results/host-sshd-*.log > bandwidth-results/host-sshd.log 2>/dev/null
          cp benchmark-status.txt bandwidth-results/benchmark-status.txt 2>/dev/null
          cp "$EMU_DIR/work/mips-emulator.log" bandwidth-results/mips-emulator.log 2>/dev/null
          if [ -f "$GITHUB_WORKSPACE/mips-emulator.pid" ]; then
            kill -- "-$(cat "$GITHUB_WORKSPACE/mips-emulator.pid")" 2>/dev/null || true
          fi
          pkill -x qemu-system-mipsel 2>/dev/null || true
          while IFS= read -r PID; do sudo kill "$PID" 2>/dev/null || true; done < "$RUNNER_TEMP/mips-sshd-pids"

      - name: Verify one host SSH authentication per benchmark run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s bandwidth-results/host-sshd.log
          AUTH_COUNT="$(grep -c 'Accepted password for sshcore-ci' bandwidth-results/host-sshd.log || true)"
          test "$AUTH_COUNT" -eq 16
          echo "PASS: exactly 16 host authentications for 16 independent one-session runs."

      - name: Analyze R65-A vs R65-B throughput, CPU and HMAC telemetry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bandwidth-results/analysis
          python3 tests/analyze_qemu_speedtest_r65_ab.py \
            bandwidth-results bandwidth-results/analysis | tee bandwidth-results/analysis-output.log

      - name: Publish R65 A/B comparison summary
        if: always()
        shell: bash
        run: |
          if [ -s bandwidth-results/analysis/summary.md ]; then
            cat bandwidth-results/analysis/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat bandwidth-results/benchmark-status.txt 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
            cat bandwidth-results/analysis-output.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload paired R65-A/R65-B bandwidth results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r65-a-r65-b-mt7621-qemu-datapacket-bandwidth
          path: bandwidth-results/**
          if-no-files-found: warn
          retention-days: 14
