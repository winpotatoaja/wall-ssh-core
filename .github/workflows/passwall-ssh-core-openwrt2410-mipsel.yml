name: Passwall SSH Core - OpenWrt 24.10.7 mipsel_24kc build

on:
  push:
    branches:
      - main
    paths:
      - 'ssh-core.c'
      - 'Makefile'
      - '.github/workflows/passwall-ssh-core-openwrt2410-mipsel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passwall-ssh-core-openwrt2410-mipsel
  cancel-in-progress: false

jobs:
  build:
    name: Build IPK for ramips/mt7621 (mipsel_24kc)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 rsync unzip wget zstd curl ca-certificates file

      - name: Download and configure OpenWrt 24.10.7 ramips/mt7621 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_BASE="https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621"
          SDK_FILE="openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          SDK_SHA256="014cd0f69b2b28088fd89e5b00e4f4d5087e2fe6da52cbaa48cd521087ebf10d"
          curl -fL --retry 3 --connect-timeout 20 "$SDK_BASE/$SDK_FILE" -o /tmp/openwrt-sdk.tar.zst
          echo "$SDK_SHA256  /tmp/openwrt-sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst
          SDK_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)"
          test -n "$SDK_DIR"
          mv "$SDK_DIR" sdk
          cd sdk

          echo "========== ADD OPENSSL/ZLIB SOURCE PACKAGES =========="
          git clone --depth 1 --filter=blob:none --sparse --branch openwrt-24.10 \
            https://github.com/openwrt/openwrt.git /tmp/openwrt-24.10-source
          git -C /tmp/openwrt-24.10-source sparse-checkout set package/libs/openssl package/libs/zlib
          mkdir -p package/libs
          cp -a /tmp/openwrt-24.10-source/package/libs/openssl package/libs/openssl
          cp -a /tmp/openwrt-24.10-source/package/libs/zlib package/libs/zlib

          TARGET_STAGING="$(find staging_dir -maxdepth 1 -type d -name 'target-*' | head -n 1)"
          test -n "$TARGET_STAGING"
          echo "Target staging: $TARGET_STAGING"

          echo "========== BUILD OPENSSL =========="
          {
            echo "CONFIG_PACKAGE_libopenssl=y"
            echo "CONFIG_OPENSSL_WITH_CHACHA_POLY1305=y"
            echo "CONFIG_OPENSSL_WITH_TLS13=y"
            echo "CONFIG_OPENSSL_WITH_BLAKE2=y"
            echo "# CONFIG_ALL is not set"
            echo "# CONFIG_ALL_KMODS is not set"
            echo "# CONFIG_ALL_NONSHARED is not set"
          } >> .config
          make defconfig
          make package/libs/openssl/compile -j"$(nproc)" V=s
          test -f "$TARGET_STAGING/usr/include/openssl/ssl.h"
          test -e "$TARGET_STAGING/usr/lib/libssl.so"
          test -e "$TARGET_STAGING/usr/lib/libcrypto.so"

          echo "========== BUILD ZLIB =========="
          echo "CONFIG_PACKAGE_zlib=y" >> .config
          make defconfig
          make package/libs/zlib/compile -j"$(nproc)" V=s
          test -f "$TARGET_STAGING/usr/include/zlib.h"
          test -e "$TARGET_STAGING/usr/lib/libz.so"

          echo "========== BUILD LIBSSH2 FROM PACKAGES FEED =========="
          ./scripts/feeds update packages
          ./scripts/feeds install libssh2
          {
            echo "CONFIG_PACKAGE_libssh2=y"
            echo "# CONFIG_ALL is not set"
            echo "# CONFIG_ALL_KMODS is not set"
            echo "# CONFIG_ALL_NONSHARED is not set"
          } >> .config
          make defconfig
          make package/feeds/packages/libssh2/compile -j"$(nproc)" V=s
          test -f "$TARGET_STAGING/usr/include/libssh2.h"
          test -e "$TARGET_STAGING/usr/lib/libssh2.so"

      - name: Compile passwall-ssh-core using repository package recipe
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="$GITHUB_WORKSPACE/sdk/package/passwall-ssh-core"
          mkdir -p "$PKG_DIR"
          cp Makefile "$PKG_DIR/Makefile"
          cp ssh-core.c "$PKG_DIR/ssh-core.c"
          cd "$GITHUB_WORKSPACE/sdk"
          echo "CONFIG_PACKAGE_passwall-ssh-core=y" >> .config
          make defconfig
          make package/passwall-ssh-core/compile -j"$(nproc)" V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f -name 'passwall-ssh-core*.ipk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.ipk' | wc -l)" -eq 1

      - name: Verify MIPS little-endian ELF and package metadata
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/sdk/build_dir/target-mipsel_24kc_musl/passwall-ssh-core/passwall-ssh-core"
          if [ ! -f "$BIN" ]; then
            BIN="$(find sdk/build_dir -type f -name passwall-ssh-core -perm -111 | head -n 1)"
          fi
          test -n "$BIN"
          file "$BIN"
          readelf -h "$BIN" | tee "$GITHUB_WORKSPACE/dist/elf-header.txt"
          readelf -h "$BIN" | grep -q 'ELF32'
          readelf -h "$BIN" | grep -qi 'little endian'
          readelf -h "$BIN" | grep -qi 'MIPS'
          sha256sum "$BIN" | tee "$GITHUB_WORKSPACE/dist/binary.sha256"
          sha256sum "$GITHUB_WORKSPACE/dist/"*.ipk | tee "$GITHUB_WORKSPACE/dist/package.sha256"
          find sdk/bin/packages -type f -name 'libssh2*.ipk' -o -name 'libopenssl*.ipk' > "$GITHUB_WORKSPACE/dist/dependency-packages.txt" || true
          cat "$GITHUB_WORKSPACE/dist/dependency-packages.txt"

      - name: Upload OpenWrt 24.10.7 mipsel_24kc IPK
        uses: actions/upload-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-24.10.7-mipsel_24kc
          path: dist/*
          if-no-files-found: error
          retention-days: 30
