name: Passwall SSH Core - MT7621 QEMU Speedtest

on:
  push:
    branches: [phase3/io-worker-pool-foundation]
    paths:
      - ".github/workflows/passwall-ssh-core-qemu-speedtest.yml"
      - "tests/qemu_speedtest.sh"
      - ".github/workflows/passwall-ssh-core-openwrt24-mipsel-vm.yml"
  workflow_dispatch:
    inputs:
      sdk_run_id:
        description: "Successful MIPS SDK run containing the package artifact"
        required: true
        default: "44998188775"
        type: string
      duration:
        description: "Sustained download test duration (seconds)"
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  qemu-speedtest:
    name: OpenWrt 24.10.7 MT7621 sustained SOCKS5 benchmark
    uses: ./.github/workflows/passwall-ssh-core-openwrt24-mipsel-vm.yml
    with:
      sdk_run_id: ${{ github.event_name == 'push' && '44998188775' || inputs.sdk_run_id }}
      benchmark_duration: ${{ github.event_name == 'push' && 60 || fromJSON(inputs.duration) }}
    permissions:
      contents: read
      actions: read
      statuses: write
