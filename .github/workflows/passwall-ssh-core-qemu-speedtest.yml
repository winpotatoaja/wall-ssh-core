name: QEMU Internet Speedtest Workflow Validation
on:
  push:
    branches:
      - phase3/io-worker-pool-foundation
    paths:
      - ".github/workflows/passwall-ssh-core-qemu-speedtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow parser and runner
        run: |
          echo "workflow-parser-ok"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
