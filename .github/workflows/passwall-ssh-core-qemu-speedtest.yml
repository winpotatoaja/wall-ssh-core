name: QEMU Internet Speedtest - Script Validation
on:
  push:
    branches:
      - phase3/io-worker-pool-foundation
    paths:
      - ".github/workflows/passwall-ssh-core-qemu-speedtest.yml"
      - "tests/qemu_speedtest.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: sh -n tests/qemu_speedtest.sh
