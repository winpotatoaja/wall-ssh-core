name: Passwall SSH core - OpenWrt 25.12.5 staged pipeline
run-name: ${{ format('Passwall SSH Core / {0}', inputs.stage || (contains(github.event.head_commit.message, '[stage=vm]') && 'vm') || (contains(github.event.head_commit.message, '[stage=sdk]') && 'sdk') || 'parser') }}

on:
  # Push commits marked [stage=parser], [stage=sdk], or [stage=vm] run one stage at a time.
  push:
    branches:
      - fix/pending-cleanup-bounded-shutdown
      - perf/4core-ssh-relay-benchmark
      - phase3/io-worker-pool-foundation
  workflow_dispatch:
    inputs:
      stage:
        description: "Jalankan satu tahap saja"
        required: true
        type: choice
        default: parser
        options:
          - parser
          - sdk
          - vm
      sdk_run_id:
        description: "Wajib untuk tahap vm: run ID dari tahap sdk yang sukses"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: passwall-ssh-core-openwrt25-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build OpenWrt 25.12.5 x86_64 and test in QEMU VM
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TEST_STAGE: ${{ inputs.stage || (contains(github.event.head_commit.message, '[stage=vm]') && 'vm') || (contains(github.event.head_commit.message, '[stage=sdk]') && 'sdk') || 'parser' }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id || '' }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          # Pin to the triggering commit; the branch tip can advance while a run is queued.
          ref: ${{ github.sha }}

      - name: Install dependencies for the selected stage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          case "$TEST_STAGE" in
            parser)
              sudo apt-get install -y --no-install-recommends \
                build-essential libssh2-1-dev libssl-dev
              ;;
            sdk)
              sudo apt-get install -y --no-install-recommends \
                build-essential clang flex bison gawk gettext git \
                libncurses-dev libssl-dev python3 rsync unzip wget zstd curl ca-certificates
              ;;
            vm)
              sudo apt-get install -y --no-install-recommends \
                qemu-system-x86 qemu-utils expect e2fsprogs openssh-server \
                python3 curl ca-certificates openssl
              ;;
            all)
              sudo apt-get install -y --no-install-recommends \
                build-essential libssh2-1-dev libssl-dev clang flex bison gawk gettext git \
                libncurses-dev python3 rsync unzip wget zstd curl ca-certificates \
                qemu-system-x86 qemu-utils expect e2fsprogs openssh-server
              ;;
            *)
              echo "Unknown stage"
              false
              ;;
          esac

      - name: Run native HTTP parser regression tests
        if: env.TEST_STAGE == 'parser'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          gcc -std=gnu11 -O1 -g -Wall -Wextra \
            -Wno-unused-parameter -Wno-unused-function -Wno-unused-variable \
            -ffunction-sections -fdata-sections \
            tests/http_parser_test.c tls_engine.c client_lifetime.c \
            -Wl,--gc-sections -o /tmp/http-parser-test \
            -lssh2 -lssl -lcrypto
          /tmp/http-parser-test | tee test-results/http-parser-test.log
          gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror -pthread tests/io_worker_pool_test.c io_worker_pool.c -o /tmp/io-worker-pool-test
          timeout 120s /tmp/io-worker-pool-test | tee test-results/io-worker-pool-test-native.log
          gcc -std=c11 -O2 -g -Wall -Wextra -Werror -I. tests/io_worker_completion_tracker_test.c io_worker_completion_tracker.c -o /tmp/io-worker-completion-tracker-test
          timeout 10s /tmp/io-worker-completion-tracker-test | tee test-results/io-worker-completion-tracker-test-native.log

      - name: Download and configure OpenWrt 25.12.5 x86_64 SDK
        if: env.TEST_STAGE == 'sdk'
        shell: bash
        run: |
          set -euo pipefail
          SDK_BASE="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64"
          SDK_FILE="$(curl -fsSL "$SDK_BASE/" | grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | head -n 1)"
          test -n "$SDK_FILE"
          echo "SDK archive: $SDK_FILE"
          curl -fL --retry 3 --connect-timeout 20 "$SDK_BASE/$SDK_FILE" -o /tmp/openwrt-sdk.tar.zst
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst
          SDK_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)"
          test -n "$SDK_DIR"
          mv "$SDK_DIR" sdk
          cd sdk

          echo "========== ADD OPENSSL SOURCE PACKAGE FROM OPENWRT 25.12 =========="
          git clone --depth 1 --filter=blob:none --sparse --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git /tmp/openwrt-25.12-source
          git -C /tmp/openwrt-25.12-source sparse-checkout set package/libs/openssl package/libs/zlib
          mkdir -p package/libs
          cp -a /tmp/openwrt-25.12-source/package/libs/openssl package/libs/openssl
          cp -a /tmp/openwrt-25.12-source/package/libs/zlib package/libs/zlib

          TARGET_STAGING="$(find staging_dir -maxdepth 1 -type d -name 'target-*' | head -n 1)"
          test -n "$TARGET_STAGING"
          echo "Target staging: $TARGET_STAGING"

          echo "========== BUILD OPENSSL FOR OPENWRT TARGET =========="
          {
            echo "CONFIG_PACKAGE_libopenssl=y"
            echo "CONFIG_OPENSSL_WITH_CHACHA_POLY1305=y"
            echo "CONFIG_OPENSSL_WITH_TLS13=y"
            echo "CONFIG_OPENSSL_WITH_BLAKE2=y"
            echo "# CONFIG_ALL is not set"
            echo "# CONFIG_ALL_KMODS is not set"
            echo "# CONFIG_ALL_NONSHARED is not set"
          } >> .config
          make defconfig
          make package/libs/openssl/compile -j"$(nproc)" V=s

          echo "========== VERIFY OPENSSL TARGET DEVELOPMENT FILES =========="
          test -f "$TARGET_STAGING/usr/include/openssl/ssl.h"
          test -e "$TARGET_STAGING/usr/lib/libssl.so"
          test -e "$TARGET_STAGING/usr/lib/libcrypto.so"

          echo "========== BUILD ZLIB TARGET DEPENDENCY =========="
          echo "CONFIG_PACKAGE_zlib=y" >> .config
          make defconfig
          make package/libs/zlib/compile -j"$(nproc)" V=s
          test -f "$TARGET_STAGING/usr/include/zlib.h"
          test -e "$TARGET_STAGING/usr/lib/libz.so"

          echo "========== INSTALL LIBSSH2 FROM OPENWRT PACKAGES FEED =========="
          ./scripts/feeds update packages
          ./scripts/feeds install libssh2
          {
            echo "CONFIG_PACKAGE_libssh2=y"
            echo "# CONFIG_ALL is not set"
            echo "# CONFIG_ALL_KMODS is not set"
            echo "# CONFIG_ALL_NONSHARED is not set"
          } >> .config
          make defconfig
          make package/feeds/packages/libssh2/compile -j"$(nproc)" V=s

          echo "========== VERIFY LIBSSH2 TARGET DEVELOPMENT FILES =========="
          test -f "$TARGET_STAGING/usr/include/libssh2.h"
          test -e "$TARGET_STAGING/usr/lib/libssh2.so"

      - name: Compile passwall-ssh-core using the repository OpenWrt package recipe
        if: env.TEST_STAGE == 'sdk'
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="$GITHUB_WORKSPACE/sdk/package/passwall-ssh-core"
          mkdir -p "$PKG_DIR"
          cp Makefile "$PKG_DIR/Makefile"
          cp ssh-core.c tls_engine.c tls_engine.h spsc_rb.h io_worker_pool.c io_worker_pool.h "$PKG_DIR/"

          cd "$GITHUB_WORKSPACE/sdk"
          echo "CONFIG_PACKAGE_passwall-ssh-core=y" >> .config
          make defconfig
          make package/passwall-ssh-core/compile -j"$(nproc)" V=s

          APK="$(find bin/packages -type f -name 'passwall-ssh-core*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cp "$APK" "$GITHUB_WORKSPACE/test-results/"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/test-results/build-source.sha"
          (cd "$GITHUB_WORKSPACE/test-results" && sha256sum "$(basename "$APK")" > apk.sha256)
          echo "Built APK: $APK"
          file "$APK"
          sha256sum "$APK"

          echo "========== CROSS-COMPILE OPENWRT HALF-CLOSE TEST CLIENT =========="
          CROSS_CC="$(find "$GITHUB_WORKSPACE/sdk/staging_dir" -path '*/bin/*-openwrt-linux-musl-gcc' -print | head -n 1)"
          test -n "$CROSS_CC"
          "$CROSS_CC" -std=c11 -Os -static -Wall -Wextra -Werror "$GITHUB_WORKSPACE/tests/socks_halfclose.c" -o "$GITHUB_WORKSPACE/test-results/socks-halfclose"
          chmod 0755 "$GITHUB_WORKSPACE/test-results/socks-halfclose"
          file "$GITHUB_WORKSPACE/test-results/socks-halfclose"
          (cd "$GITHUB_WORKSPACE/test-results" && sha256sum socks-halfclose > halfclose.sha256)
          "$CROSS_CC" -std=gnu11 -Os -static -Wall -Wextra -Werror -pthread \
            "$GITHUB_WORKSPACE/tests/io_worker_pool_test.c" "$GITHUB_WORKSPACE/io_worker_pool.c" \
            -o "$GITHUB_WORKSPACE/test-results/io-worker-pool-test"
          chmod 0755 "$GITHUB_WORKSPACE/test-results/io-worker-pool-test"
          file "$GITHUB_WORKSPACE/test-results/io-worker-pool-test"
          (cd "$GITHUB_WORKSPACE/test-results" && sha256sum io-worker-pool-test > io-worker-pool.sha256)

          find staging_dir/target-* -name 'libssh2.so*' -o -name 'libssl.so*' -o -name 'libcrypto.so*' | head -30

      - name: Save OpenWrt APK for the separate VM stage
        if: env.TEST_STAGE == 'sdk'
        uses: actions/upload-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-apk
          path: |
            test-results/passwall-ssh-core*.apk
            test-results/build-source.sha
            test-results/apk.sha256
            test-results/socks-halfclose
            test-results/halfclose.sha256
            test-results/io-worker-pool-test
            test-results/io-worker-pool.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Show SDK run ID for the VM stage
        if: env.TEST_STAGE == 'sdk'
        shell: bash
        run: |
          {
            echo "## OpenWrt SDK build succeeded"
            echo
            printf '%s\n' 'Use this run ID as the `sdk_run_id` input when selecting the `vm` stage:'
            echo
            printf '`%s`\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate SDK run ID for the VM stage
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          if [ -z "$SDK_RUN_ID" ]; then
            SDK_COMMIT_MESSAGE="$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH")"
            SDK_RUN_ID="$(printf '%s\n' "$SDK_COMMIT_MESSAGE" | sed -n 's/.*\[sdk_run_id=\([0-9][0-9]*\)\].*/\1/p')"
          fi
          if [ -z "$SDK_RUN_ID" ]; then
            echo "Provide sdk_run_id input or [sdk_run_id=RUN_ID] in the push commit message."
            false
          fi
          case "$SDK_RUN_ID" in
            *[!0-9]*)
              echo "sdk_run_id must contain digits only"
              false
              ;;
          esac
          echo "SDK_RUN_ID=$SDK_RUN_ID" >> "$GITHUB_ENV"
          echo "Using SDK run ID: $SDK_RUN_ID"

      # Manual VM stage consumes an artifact from a separate SDK workflow run.
      - name: Download APK artifact from selected SDK run
        if: env.TEST_STAGE == 'vm'
        uses: actions/download-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-apk
          run-id: ${{ env.SDK_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: test-results

      - name: Verify APK and package source match current branch
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          SDK_SOURCE_SHA="$(tr -d '[:space:]' < test-results/build-source.sha)"
          if ! printf '%s' "$SDK_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "SDK artifact source commit is missing or malformed."
            false
          fi
          # Permit workflow/docs-only commits, but reject changes to compiled inputs.
          git fetch --no-tags --depth=1 origin "$SDK_SOURCE_SHA"
          if ! git diff --quiet "$SDK_SOURCE_SHA" "$GITHUB_SHA" -- Makefile ssh-core.c tls_engine.c tls_engine.h spsc_rb.h io_worker_pool.c io_worker_pool.h io_worker_completion_tracker.c io_worker_completion_tracker.h tests/io_worker_completion_tracker_test.c tests/socks_halfclose.c tests/io_worker_pool_test.c; then
            echo "The APK or half-close helper was built from different source inputs."
            git diff --stat "$SDK_SOURCE_SHA" "$GITHUB_SHA" -- Makefile ssh-core.c tls_engine.c tls_engine.h spsc_rb.h io_worker_pool.c io_worker_pool.h tests/socks_halfclose.c tests/io_worker_pool_test.c
            false
          fi
          (cd test-results && sha256sum -c apk.sha256 halfclose.sha256 io-worker-pool.sha256)
      - name: Record four-core CI and QEMU test topology
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          {
            echo "GitHub runner CPU topology:"
            nproc
            lscpu
            echo
            echo "QEMU guest vCPU target: 4"
          } | tee test-results/4core-host-topology.txt

      - name: Prepare host-side SSH and HTTP forwarding targets
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ssh-core-http
          dd if=/dev/urandom of=/tmp/ssh-core-http/payload-1MiB.bin bs=1M count=1 status=none
          sha256sum /tmp/ssh-core-http/payload-1MiB.bin | awk '{print $1}' > /tmp/ssh-core-http/payload-1MiB.sha256
          dd if=/dev/urandom of=/tmp/ssh-core-http/slow-download-32MiB.bin bs=1M count=32 status=none
          sha256sum /tmp/ssh-core-http/slow-download-32MiB.bin | awk '{print $1}' > /tmp/ssh-core-http/slow-download-32MiB.sha256
          dd if=/dev/urandom of=/tmp/ssh-core-http/half-close-upload-8MiB.bin bs=1M count=8 status=none
          sha256sum /tmp/ssh-core-http/half-close-upload-8MiB.bin | awk '{print $1}' > /tmp/ssh-core-http/half-close-upload-8MiB.sha256
          dd if=/dev/zero of=/tmp/ssh-core-http/idle-active-6MiB.bin bs=1M count=6 status=none
          sha256sum /tmp/ssh-core-http/idle-active-6MiB.bin | awk '{print $1}' > /tmp/ssh-core-http/idle-active-6MiB.sha256

          cat > /tmp/ssh-core-http-server.py <<'PY_SERVER'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import hashlib
          import os
          import socket
          import threading
          import time

          ROOT = "/tmp/ssh-core-http"

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print("%s - %s" % (self.client_address[0], fmt % args), flush=True)

              def do_GET(self):
                  if self.path == "/health":
                      body = b"ok\n"
                  elif self.path == "/payload":
                      with open(os.path.join(ROOT, "payload-1MiB.bin"), "rb") as f:
                          body = f.read()
                  elif self.path == "/idle":
                      body = b"I" * 64
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      print("[IDLE-TEST] holding one direct-tcpip channel without response data", flush=True)
                      time.sleep(40.0)
                      try:
                          self.wfile.write(body)
                          self.wfile.flush()
                      except (BrokenPipeError, ConnectionResetError, OSError):
                          print("[IDLE-TEST] idle client channel was closed before response", flush=True)
                      self.close_connection = True
                      return
                  elif self.path == "/idle-active":
                      self.send_response(200)
                      self.send_header("Content-Length", str(6 * 1024 * 1024))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      with open(os.path.join(ROOT, "idle-active-6MiB.bin"), "rb") as f:
                          while True:
                              block = f.read(65536)
                              if not block:
                                  break
                              self.wfile.write(block)
                              self.wfile.flush()
                              time.sleep(0.25)
                      self.close_connection = True
                      return
                  elif self.path == "/slow-download":
                      with open(os.path.join(ROOT, "slow-download-32MiB.bin"), "rb") as f:
                          body = f.read()
                      self.connection.setsockopt(socket.SOL_SOCKET, socket.SO_SNDBUF, 32768)
                  elif self.path == "/half-close-server-eof-large":
                      body = b"server-half-close-large-ok\n"
                      expected_size = 8 * 1024 * 1024
                      expected_sha = open(os.path.join(ROOT, "half-close-upload-8MiB.sha256")).read().strip()
                      self.connection.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, 32768)
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(body)
                      self.wfile.flush()
                      self.connection.shutdown(socket.SHUT_WR)
                      print("[HALFCLOSE-LARGE] remote FIN sent; pausing reads to exhaust SSH window", flush=True)
                      time.sleep(8.0)
                      self.connection.settimeout(45.0)
                      digest = hashlib.sha256()
                      received = 0
                      try:
                          while received < expected_size:
                              part = self.connection.recv(min(16384, expected_size - received))
                              if not part:
                                  break
                              digest.update(part)
                              received += len(part)
                      except (TimeoutError, OSError):
                          pass
                      actual_sha = digest.hexdigest()
                      if received == expected_size and actual_sha == expected_sha:
                          print("[HALFCLOSE-LARGE] PASS received exact 8388608-byte upload SHA-256=%s" % actual_sha, flush=True)
                      else:
                          print("[HALFCLOSE-LARGE] FAIL received=%d expected=%d SHA-256=%s expected_sha=%s" %
                                (received, expected_size, actual_sha, expected_sha), flush=True)
                      self.close_connection = True
                      return
                  elif self.path == "/half-close-server-eof":
                      body = b"server-half-close-ok\n"
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(body)
                      self.wfile.flush()
                      self.connection.shutdown(socket.SHUT_WR)
                      self.connection.settimeout(20.0)
                      expected = b"client-write-after-server-fin"
                      received = bytearray()
                      try:
                          while len(received) < len(expected):
                              part = self.connection.recv(len(expected) - len(received))
                              if not part:
                                  break
                              received.extend(part)
                      except (TimeoutError, OSError):
                          pass
                      if bytes(received) == expected:
                          print("[HALFCLOSE] server FIN path received exact client trailer", flush=True)
                      else:
                          print("[HALFCLOSE] server FIN path trailer mismatch: %r" % bytes(received), flush=True)
                      self.close_connection = True
                      return
                  elif self.path == "/abort-stream":
                      body = b"A" * (16 * 1024 * 1024)
                  else:
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Connection", "close")
                  self.end_headers()
                  try:
                      self.wfile.write(body)
                  except (BrokenPipeError, ConnectionResetError, OSError):
                      if self.path == "/abort-stream":
                          print("[ABORT] client disconnected during streaming response", flush=True)
                  self.close_connection = True

              def do_POST(self):
                  if self.path == "/duplex-backpressure":
                      expected_upload = 8 * 1024 * 1024
                      expected_upload_sha = open(os.path.join(ROOT, "half-close-upload-8MiB.sha256")).read().strip()
                      expected_download = 32 * 1024 * 1024
                      self.connection.setsockopt(socket.SOL_SOCKET, socket.SO_SNDBUF, 32768)
                      self.connection.settimeout(120.0)
                      self.send_response(200)
                      self.send_header("Content-Length", str(expected_download))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.flush()

                      response_state = {"sent": 0, "error": ""}
                      def send_duplex_response():
                          try:
                              with open(os.path.join(ROOT, "slow-download-32MiB.bin"), "rb") as f:
                                  while True:
                                      block = f.read(16384)
                                      if not block:
                                          break
                                      self.wfile.write(block)
                                      self.wfile.flush()
                                      response_state["sent"] += len(block)
                          except (BrokenPipeError, ConnectionResetError, OSError) as exc:
                              response_state["error"] = repr(exc)

                      response_thread = threading.Thread(target=send_duplex_response, daemon=True)
                      response_thread.start()

                      upload_digest = hashlib.sha256()
                      upload_received = 0
                      try:
                          while upload_received < expected_upload:
                              block = self.rfile.read(min(16384, expected_upload - upload_received))
                              if not block:
                                  break
                              upload_digest.update(block)
                              upload_received += len(block)
                          client_fin = (self.connection.recv(1) == b"") if upload_received == expected_upload else False
                      except (TimeoutError, OSError):
                          client_fin = False

                      response_thread.join(120.0)
                      upload_sha = upload_digest.hexdigest()
                      response_ok = (not response_thread.is_alive() and
                                     response_state["sent"] == expected_download and
                                     not response_state["error"])
                      upload_ok = (upload_received == expected_upload and
                                   upload_sha == expected_upload_sha and client_fin)
                      if response_ok and upload_ok:
                          print("[DUPLEX] PASS upload=8388608 SHA-256=%s client_FIN=%s response=33554432" %
                                (upload_sha, client_fin), flush=True)
                      else:
                          print("[DUPLEX] FAIL upload=%d expected=%d SHA-256=%s expected_sha=%s client_FIN=%s response=%d expected_response=%d error=%s alive=%s" %
                                (upload_received, expected_upload, upload_sha, expected_upload_sha,
                                 client_fin, response_state["sent"], expected_download,
                                 response_state["error"], response_thread.is_alive()), flush=True)
                      self.close_connection = True
                      return

                  if self.path == "/half-close-client-eof":
                      expected = int(self.headers.get("Content-Length", "0"))
                      body = self.rfile.read(expected)
                      self.connection.settimeout(20.0)
                      try:
                          extra = self.connection.recv(1)
                          client_fin = (extra == b"")
                      except (TimeoutError, OSError):
                          client_fin = False
                      if client_fin and len(body) == expected:
                          print("[HALFCLOSE] client FIN observed after complete request body", flush=True)
                      else:
                          print("[HALFCLOSE] client FIN missing or body short: fin=%s size=%d expected=%d" %
                                (client_fin, len(body), expected), flush=True)
                      self.send_response(200 if client_fin and len(body) == expected else 400)
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("Connection", "close")
                      self.end_headers()
                      self.wfile.write(body)
                      self.close_connection = True
                      return

                  if self.path != "/slow-upload" and not self.path.startswith("/parallel-upload/"):
                      self.send_error(404)
                      return
                  # Constrain the host-side TCP receive window and pause reads
                  # after headers. This backs up sshd's channel consumer so that
                  # libssh2_channel_write() must encounter a depleted SSH window.
                  self.connection.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, 32768)
                  receive_buffer = self.connection.getsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF)
                  window_clamp = 0
                  if hasattr(socket, "TCP_WINDOW_CLAMP"):
                      try:
                          self.connection.setsockopt(socket.IPPROTO_TCP, socket.TCP_WINDOW_CLAMP, 32768)
                          window_clamp = self.connection.getsockopt(socket.IPPROTO_TCP, socket.TCP_WINDOW_CLAMP)
                      except OSError:
                          window_clamp = -1

                  remaining = int(self.headers.get("Content-Length", "0"))
                  digest = hashlib.sha256()
                  received = 0
                  started = time.monotonic()
                  print("[BACKPRESSURE] recvbuf=%d window_clamp=%d initial_pause=8s expected=%d" %
                        (receive_buffer, window_clamp, remaining), flush=True)
                  # Stop consuming the forwarded TCP stream long enough to fill
                  # the SSH channel window and the small kernel receive buffer.
                  time.sleep(8.0)
                  print("[BACKPRESSURE] receiver resumed; beginning slow drain", flush=True)
                  while remaining:
                      block = self.rfile.read(min(16384, remaining))
                      if not block:
                          break
                      digest.update(block)
                      received += len(block)
                      remaining -= len(block)
                      time.sleep(0.02)
                  elapsed = time.monotonic() - started
                  print("[BACKPRESSURE] received=%d remaining=%d elapsed=%.3fs" %
                        (received, remaining, elapsed), flush=True)
                  body = ("size=%d sha256=%s recvbuf=%d window_clamp=%d elapsed=%.3f\n" %
                          (received, digest.hexdigest(), receive_buffer, window_clamp, elapsed)).encode()
                  self.send_response(200 if remaining == 0 else 400)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Connection", "close")
                  self.end_headers()
                  self.wfile.write(body)
                  self.close_connection = True

          ThreadingHTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY_SERVER
          python3 -m py_compile /tmp/ssh-core-http-server.py
          python3 /tmp/ssh-core-http-server.py >/tmp/ssh-core-http-server.log 2>&1 &
          echo "$!" >/tmp/ssh-core-http-server.pid

          # Keep sshd's forwarded TCP send queue below the SSH channel window.
          # With a stalled, small-window HTTP receiver this forces SSH window
          # exhaustion instead of buffering the entire upload in the host kernel.
          sudo sysctl -w net.core.wmem_max=32768 | tee /tmp/ssh-core-tcp-buffers.log
          sudo sysctl -w net.core.wmem_default=32768 | tee -a /tmp/ssh-core-tcp-buffers.log
          sudo sysctl -w net.ipv4.tcp_wmem="4096 8192 32768" | tee -a /tmp/ssh-core-tcp-buffers.log

          sudo useradd -m -s /bin/bash sshcore-ci
          echo 'sshcore-ci:OpenWrt-CI-SSH-Only-2026' | sudo chpasswd
          sudo ssh-keygen -A
          # OpenSSH privilege separation requires this runtime directory on
          # minimal GitHub-hosted runners before sshd can bind its listener.
          sudo install -d -m 0755 -o root -g root /run/sshd
          sudo /usr/sbin/sshd -D -e -f /dev/null \
            -p 2222 \
            -o PidFile=/tmp/ssh-core-sshd.pid \
            -o HostKey=/etc/ssh/ssh_host_ed25519_key \
            -o ListenAddress=0.0.0.0 \
            -o PasswordAuthentication=yes \
            -o KbdInteractiveAuthentication=no \
            -o PubkeyAuthentication=no \
            -o PermitRootLogin=no \
            -o UsePAM=no \
            -o StrictModes=no \
            -o AllowUsers=sshcore-ci \
            -o AllowTcpForwarding=yes \
            -o PermitOpen=127.0.0.1:18080 \
            -o LogLevel=VERBOSE >/tmp/ssh-core-sshd.log 2>&1 &
          echo "$!" >/tmp/ssh-core-sshd.pid.host

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null && \
               timeout 2 bash -c '</dev/tcp/127.0.0.1/2222' 2>/dev/null; then
              echo "Host HTTP endpoint and SSHD are ready."
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health

          echo "========== PREPARE TLS-TERMINATED SSH RELAY =========="
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/ssh-core-tls.key -out /tmp/ssh-core-tls.crt \
            -subj '/CN=localhost' -days 2 >/tmp/ssh-core-tls-cert.log 2>&1
          cat > /tmp/ssh-core-tls-relay.py <<'PY_TLS'
          import socket
          import ssl
          import threading

          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain('/tmp/ssh-core-tls.crt', '/tmp/ssh-core-tls.key')

          def pump(source, destination):
              try:
                  while True:
                      block = source.recv(65536)
                      if not block:
                          break
                      destination.sendall(block)
              except (BrokenPipeError, ConnectionResetError, OSError, ssl.SSLError):
                  pass
              if not isinstance(destination, ssl.SSLSocket):
                  try:
                      destination.shutdown(socket.SHUT_WR)
                  except OSError:
                      pass

          def handle(raw, address):
              tls = None
              upstream = None
              try:
                  tls = context.wrap_socket(raw, server_side=True)
                  upstream = socket.create_connection(('127.0.0.1', 2222), timeout=10)
                  tls.settimeout(None)
                  upstream.settimeout(None)
                  print('[TLS-RELAY] TLS client connected from %s' % (address,), flush=True)
                  client_to_ssh = threading.Thread(target=pump, args=(tls, upstream), daemon=True)
                  ssh_to_client = threading.Thread(target=pump, args=(upstream, tls), daemon=True)
                  client_to_ssh.start()
                  ssh_to_client.start()
                  client_to_ssh.join()
                  ssh_to_client.join()
                  try:
                      raw = tls.unwrap()
                      tls = None
                      print('[TLS-RELAY] close_notify exchange completed', flush=True)
                  except (OSError, ssl.SSLError) as exc:
                      print('[TLS-RELAY] close_notify exchange failed: %r' % (exc,), flush=True)
              except Exception as exc:
                  print('[TLS-RELAY] connection error: %r' % (exc,), flush=True)
              finally:
                  for item in (upstream, tls, raw):
                      if item is not None:
                          try:
                              item.close()
                          except OSError:
                              pass

          listener = socket.socket()
          listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          listener.bind(('0.0.0.0', 8443))
          listener.listen(64)
          print('[TLS-RELAY] listening on 0.0.0.0:8443 -> 127.0.0.1:2222', flush=True)
          while True:
              connection, address = listener.accept()
              threading.Thread(target=handle, args=(connection, address), daemon=True).start()
          PY_TLS
          python3 -m py_compile /tmp/ssh-core-tls-relay.py
          python3 /tmp/ssh-core-tls-relay.py >/tmp/ssh-core-tls-relay.log 2>&1 &
          echo "$!" >/tmp/ssh-core-tls-relay.pid
          for attempt in $(seq 1 30); do
            if sudo ss -lnt | grep -q ':8443'; then
              break
            fi
            sleep 1
          done
          sudo ss -lntp | grep -E ':2222|:8443|:18080'

      - name: Download and prepare OpenWrt 25.12.5 x86_64 VM rootfs
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64"
          curl -fL --retry 3 --connect-timeout 20 \
            "$BASE/openwrt-25.12.5-x86-64-generic-kernel.bin" \
            -o /tmp/openwrt-kernel.bin
          curl -fL --retry 3 --connect-timeout 20 \
            "$BASE/openwrt-25.12.5-x86-64-generic-ext4-rootfs.img.gz" \
            -o /tmp/openwrt-rootfs.img.gz
          echo "e440f082d59550072b1421f10d1a83449c6a4cf356eea5bfa9ac1306978d649b  /tmp/openwrt-kernel.bin" | sha256sum -c -
          echo "a1cb366a0af03d0f4afbce90aed9b4db35b07140629eabf7ae21c45dc08eeb23  /tmp/openwrt-rootfs.img.gz" | sha256sum -c -
          gzip -dc /tmp/openwrt-rootfs.img.gz > /tmp/openwrt-rootfs.img
          truncate -s 2G /tmp/openwrt-rootfs.img
          sudo resize2fs /tmp/openwrt-rootfs.img
          sudo mkdir -p /mnt/openwrt-root
          sudo mount -o loop /tmp/openwrt-rootfs.img /mnt/openwrt-root

          ROOT=/mnt/openwrt-root
          APK="$(find "$GITHUB_WORKSPACE/test-results" -maxdepth 1 -name 'passwall-ssh-core*.apk' | head -n 1)"
          test -n "$APK"
          sudo install -m 0644 "$APK" "$ROOT/root/passwall-ssh-core.apk"
          sudo install -m 0755 "$GITHUB_WORKSPACE/test-results/socks-halfclose" "$ROOT/root/socks-halfclose"
          sudo install -m 0644 /tmp/ssh-core-http/half-close-upload-8MiB.bin "$ROOT/root/half-close-upload-8MiB.bin"
          HALF_CLOSE_UPLOAD_SHA="$(cat /tmp/ssh-core-http/half-close-upload-8MiB.sha256)"
          printf '%s\n' "$HALF_CLOSE_UPLOAD_SHA" | sudo tee "$ROOT/root/expected-upload.sha256" >/dev/null
          IDLE_ACTIVE_SHA="$(cat /tmp/ssh-core-http/idle-active-6MiB.sha256)"
          printf '%s\n' "$IDLE_ACTIVE_SHA" | sudo tee "$ROOT/root/expected-idle-active.sha256" >/dev/null
          EXPECTED_SHA="$(cat /tmp/ssh-core-http/payload-1MiB.sha256)"
          printf '%s\n' "$EXPECTED_SHA" | sudo tee "$ROOT/root/expected-payload.sha256" >/dev/null
          EXPECTED_S2C_SHA="$(cat /tmp/ssh-core-http/slow-download-32MiB.sha256)"
          printf '%s\n' "$EXPECTED_S2C_SHA" | sudo tee "$ROOT/root/expected-s2c.sha256" >/dev/null

          sudo mkdir -p "$ROOT/root/ssh-core-test-logs" "$ROOT/etc/uci-defaults"
          sudo tee "$ROOT/etc/uci-defaults/99-qemu-ci-network" >/dev/null <<'GUEST_NET'
          #!/bin/sh
          uci set network.lan.proto='dhcp'
          uci commit network
          GUEST_NET
          sudo chmod 0755 "$ROOT/etc/uci-defaults/99-qemu-ci-network"

          sudo tee "$ROOT/root/run-passwall-ssh-core-test.sh" >/dev/null <<'GUEST_TEST'
          #!/bin/sh
          set -u
          LOGDIR=/root/ssh-core-test-logs
          BIN=/usr/bin/passwall-ssh-core
          STATUS=0
          APP_PID=
          mkdir -p "$LOGDIR"
          pass() { echo "[PASS] $*"; }
          fail() { echo "[FAIL] $*"; STATUS=2; }

          echo "========== OPENWRT GUEST =========="
          cat /etc/openwrt_release
          uname -a
          echo "========== INSTALL APK AND CURL =========="
          apk update
          APK_RC=$?
          if [ "$APK_RC" -eq 0 ]; then
            apk add --allow-untrusted /root/passwall-ssh-core.apk curl
            APK_RC=$?
          fi
          if [ "$APK_RC" -ne 0 ]; then
            fail "apk dependencies or passwall-ssh-core package installation failed"
          fi

          if [ "$APK_RC" -eq 0 ]; then
            if [ -x "$BIN" ] && grep -qx "$BIN" /lib/apk/packages/passwall-ssh-core.list; then
              pass "APK installs and owns /usr/bin/passwall-ssh-core"
            else
              fail "APK executable path or ownership manifest does not match /usr/bin/passwall-ssh-core"
            fi
            echo "========== BINARY / DYNAMIC LIBRARIES =========="
            "$BIN" -h
            if [ "$?" -eq 0 ]; then pass "ssh-core starts and prints usage"; else fail "ssh-core -h"; fi
            ldd "$BIN" 2>&1 | tee "$LOGDIR/ldd.log"
            echo "========== LIMIT GUEST TCP SEND QUEUES FOR S2C TEST =========="
            sysctl -w net.core.wmem_max=16384
            sysctl -w net.core.wmem_default=16384
            sysctl -w net.ipv4.tcp_wmem="4096 8192 16384"

            echo "========== SOCKS BIND SAFETY =========="
            if "$BIN" -host 127.0.0.1 -user ci -socks 0.0.0.0:1081 -log - >"$LOGDIR/bind-guard.log" 2>&1; then
              fail "non-loopback unauthenticated SOCKS bind was not rejected"
            elif grep -q "non-loopback ditolak" "$LOGDIR/bind-guard.log"; then
              pass "non-loopback SOCKS bind rejected unless explicitly enabled"
            else
              fail "bind guard did not produce its expected diagnostic"
            fi

            echo "========== STRICT NUMERIC CONFIGURATION =========="
            if "$BIN" -host 127.0.0.1 -user ci -max-clients 999999999999999999999 -log - >"$LOGDIR/number-guard.log" 2>&1; then
              fail "overflowing MAX_CLIENTS argument was accepted"
            else
              pass "overflowing MAX_CLIENTS argument rejected"
            fi

            cat > /root/ssh-core-test.env <<'GUEST_ENV'
          TRANSPORT=TCP
          HOST=10.0.2.2
          HOST_PORT=2222
          USERNAME=sshcore-ci
          PASSWORD=OpenWrt-CI-SSH-Only-2026
          DELAY=0
          FIX_CRLF=1
          SOCKS_ADDR=127.0.0.1:1080
          KEEPALIVE=15
          VERIFY_TLS=0
          MAX_CLIENTS=32
          IDLE_TIMEOUT=600
          LOG_BACKPRESSURE=1
          GUEST_ENV
            "$BIN" -env /root/ssh-core-test.env -log "$LOGDIR/ssh-core.log" >"$LOGDIR/ssh-core-stdout.log" 2>&1 &
            APP_PID=$!

            echo "========== WAIT FOR SSH AUTH AND SOCKS LISTENER =========="
            COUNT=0
            while [ "$COUNT" -lt 90 ]; do
              if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core.log" 2>/dev/null; then
                break
              fi
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                break
              fi
              COUNT=$((COUNT + 1))
              sleep 1
            done
            if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core.log" 2>/dev/null; then
              pass "SSH password authentication completed and SOCKS5 listener started"
              echo "========== TWO-DIRECTION TCP HALF-CLOSE TEST =========="
              if /root/socks-halfclose /root/half-close-upload-8MiB.bin; then
                pass "client-FIN-first, server-FIN-first and 8 MiB post-EOF upload half-close paths completed"
              else
                fail "one or more TCP half-close paths failed, including 8 MiB post-EOF upload"
              fi

              echo "========== TCP 8 MiB UPLOAD WHILE S2C RING IS FULL =========="
              if /root/socks-halfclose --duplex /root/half-close-upload-8MiB.bin /tmp/tcp-duplex-32MiB.bin 1080; then
                DUPLEX_SIZE="$(wc -c </tmp/tcp-duplex-32MiB.bin 2>/dev/null | tr -d ' ')"
                DUPLEX_SHA="$(sha256sum /tmp/tcp-duplex-32MiB.bin 2>/dev/null | awk '{print $1}')"
                EXPECTED_DUPLEX_SHA="$(cat /root/expected-s2c.sha256)"
                DUPLEX_FULL_COUNT="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
                DUPLEX_DRAIN_COUNT="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
                if [ "$DUPLEX_SIZE" = "33554432" ] && [ "$DUPLEX_SHA" = "$EXPECTED_DUPLEX_SHA" ] && \
                  [ "$DUPLEX_FULL_COUNT" -gt 0 ] && [ "$DUPLEX_DRAIN_COUNT" -gt 0 ]; then
                  pass "TCP full-duplex 8 MiB upload completed with exact 32 MiB response while S2C reached 128 KiB and drained"
                else
                  fail "TCP full-duplex backpressure mismatch (size=$DUPLEX_SIZE sha=$DUPLEX_SHA full=$DUPLEX_FULL_COUNT drained=$DUPLEX_DRAIN_COUNT)"
                fi
              else
                fail "TCP full-duplex upload/S2C saturation helper failed"
              fi
            else
              fail "SSH authentication/listener startup timeout"
              cat "$LOGDIR/ssh-core-stdout.log" 2>/dev/null
              cat "$LOGDIR/ssh-core.log" 2>/dev/null
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== SINGLE SOCKS DOWNLOAD (1 MiB) =========="
            if curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
              --connect-timeout 15 --max-time 90 \
              http://127.0.0.1:18080/payload -o /tmp/download-1MiB.bin; then
              ACTUAL_SIZE="$(wc -c </tmp/download-1MiB.bin | tr -d ' ')"
              EXPECTED_SIZE=1048576
              EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
              ACTUAL_SHA="$(sha256sum /tmp/download-1MiB.bin | awk '{print $1}')"
              if [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ] && [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                pass "1 MiB SOCKS download hash and length verified"
              else
                fail "1 MiB download size/hash mismatch: size=$ACTUAL_SIZE sha=$ACTUAL_SHA"
              fi
            else
              fail "single SOCKS download failed"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== FOUR CONCURRENT SOCKS CHANNELS =========="
            I=1
            CURL_PIDS=""
            CONCURRENT_CURL_FAILED=0
            while [ "$I" -le 4 ]; do
              curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
                --connect-timeout 15 --max-time 120 \
                http://127.0.0.1:18080/payload -o "/tmp/concurrent-$I.bin" &
              CURL_PID=$!
              CURL_PIDS="$CURL_PIDS $CURL_PID"
              I=$((I + 1))
            done

            # Wait only for the four curl workers. A bare 'wait' also waits for
            # APP_PID (the long-lived ssh-core SOCKS service), causing a hang.
            for CURL_PID in $CURL_PIDS; do
              if ! wait "$CURL_PID"; then
                CONCURRENT_CURL_FAILED=1
              fi
            done

            I=1
            CONCURRENT_OK=1
            EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
            if [ "$CONCURRENT_CURL_FAILED" -ne 0 ]; then
              CONCURRENT_OK=0
            fi
            while [ "$I" -le 4 ]; do
              if [ -f "/tmp/concurrent-$I.bin" ]; then
                SHA="$(sha256sum "/tmp/concurrent-$I.bin" 2>/dev/null | awk '{print $1}')"
                SIZE="$(wc -c <"/tmp/concurrent-$I.bin" 2>/dev/null | tr -d ' ')"
                if [ "$SHA" != "$EXPECTED_SHA" ] || [ "$SIZE" != "1048576" ]; then
                  CONCURRENT_OK=0
                fi
              else
                CONCURRENT_OK=0
              fi
              I=$((I + 1))
            done
            if [ "$CONCURRENT_OK" -eq 1 ]; then
              pass "four parallel direct-tcpip channels transferred exact data"
            else
              fail "concurrent channel transfer failed or data size/hash mismatch"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== FORCED 32 MiB UPLOAD / SSH CHANNEL WINDOW BACKPRESSURE =========="
            dd if=/dev/urandom of=/tmp/upload-32MiB.bin bs=1M count=32 2>/dev/null
            LOCAL_SHA="$(sha256sum /tmp/upload-32MiB.bin | awk '{print $1}')"
            if RESPONSE="$(curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
              --connect-timeout 20 --max-time 300 \
              --data-binary @/tmp/upload-32MiB.bin \
              http://127.0.0.1:18080/slow-upload)"; then
              echo "$RESPONSE"
              if echo "$RESPONSE" | grep -q "size=33554432 sha256=$LOCAL_SHA"; then
                pass "forced 32 MiB upload completed with matching remote SHA-256"
              else
                fail "forced upload response did not match sent bytes"
              fi
            else
              fail "forced upload through SSH SOCKS failed"
            fi
            if [ "$STATUS" -eq 0 ]; then
              echo "========== FOUR CONCURRENT 8 MiB UPLOADS =========="
              dd if=/dev/urandom of=/tmp/parallel-upload-8MiB.bin bs=1M count=8 2>/dev/null
              PARALLEL_SHA="$(sha256sum /tmp/parallel-upload-8MiB.bin | awk '{print $1}')"
              I=1
              UPLOAD_PIDS=""
              while [ "$I" -le 4 ]; do
                (
                  if RESPONSE="$(curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
                    --connect-timeout 20 --max-time 180 \
                    --data-binary @/tmp/parallel-upload-8MiB.bin \
                    "http://127.0.0.1:18080/parallel-upload/$I")"; then
                    printf '%s\n' "$RESPONSE" > "/tmp/parallel-upload-$I.response"
                    if echo "$RESPONSE" | grep -q "size=8388608 sha256=$PARALLEL_SHA"; then
                      echo PASS > "/tmp/parallel-upload-$I.status"
                    else
                      echo FAIL > "/tmp/parallel-upload-$I.status"
                    fi
                  else
                    echo FAIL > "/tmp/parallel-upload-$I.status"
                  fi
                ) &
                UPLOAD_PIDS="$UPLOAD_PIDS $!"
                I=$((I + 1))
              done
              for UPLOAD_PID in $UPLOAD_PIDS; do
                wait "$UPLOAD_PID" || true
              done
              I=1
              PARALLEL_UPLOAD_OK=1
              while [ "$I" -le 4 ]; do
                if [ ! -f "/tmp/parallel-upload-$I.status" ] || [ "$(cat "/tmp/parallel-upload-$I.status")" != "PASS" ]; then
                  PARALLEL_UPLOAD_OK=0
                  cat "/tmp/parallel-upload-$I.response" 2>/dev/null || true
                fi
                I=$((I + 1))
              done
              if [ "$PARALLEL_UPLOAD_OK" -eq 1 ]; then
                pass "four simultaneous 8 MiB uploads returned matching remote size and SHA-256"
              else
                fail "one or more simultaneous uploads failed or returned corrupt data"
              fi
            fi

            WINDOW_FULL_COUNT="$(grep -c "SSH channel window penuh" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            WINDOW_RECOVERED_COUNT="$(grep -c "SSH channel window recovered; write resumed" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            WINDOW_EAGAIN_COUNT="$(grep -c "write_window=0" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            BUFFER_DRAINED_COUNT="$(grep -c "SSH channel buffer drained after window recovery" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            BUFFER_NOT_DRAINED_COUNT="$(grep -c "SSH channel buffer not drained at close" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            echo "SSH channel blocked transitions: $WINDOW_FULL_COUNT"
            echo "SSH channel successful recoveries: $WINDOW_RECOVERED_COUNT"
            echo "SSH channel EAGAIN/zero-window observations: $WINDOW_EAGAIN_COUNT"
            echo "SSH channel drained-buffer reports: $BUFFER_DRAINED_COUNT"
            if [ "$WINDOW_FULL_COUNT" -gt 0 ] && [ "$WINDOW_RECOVERED_COUNT" -eq "$WINDOW_FULL_COUNT" ]; then
              pass "every logged window-block episode recovered through a successful channel write"
            else
              fail "window-block/recovery log counts do not match"
            fi
            if [ "$WINDOW_EAGAIN_COUNT" -gt 0 ]; then
              pass "libssh2 EAGAIN with an explicitly zero SSH write window was observed"
            else
              fail "forced upload did not exercise the EAGAIN zero-window path"
            fi
            if [ "$BUFFER_DRAINED_COUNT" -gt 0 ] && [ "$BUFFER_NOT_DRAINED_COUNT" -eq 0 ]; then
              if grep "SSH channel buffer drained after window recovery" "$LOGDIR/ssh-core.log" | \
                sed -n 's/.*peak=\([0-9][0-9]*\)\/\([0-9][0-9]*\).*/\1 \2/p' | \
                awk '$1 > $2 { bad=1 } END { if (NR == 0 || bad) exit 1 }'; then
                pass "all c2s ring buffers drained to zero and every peak stayed within its configured bound"
              else
                fail "one or more c2s ring-buffer high-water marks were missing or exceeded capacity"
              fi
            else
              fail "c2s ring buffer was not confirmed empty at channel close"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== S2C SLOW-READER BACKPRESSURE (32 MiB DOWNLOAD) =========="
            S2C_FULL_BEFORE="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            S2C_DRAINED_BEFORE="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            if curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
              --connect-timeout 20 --max-time 420 --limit-rate 128K \
              http://127.0.0.1:18080/slow-download -o /tmp/slow-download-32MiB.bin; then
              S2C_SIZE="$(wc -c </tmp/slow-download-32MiB.bin | tr -d ' ')"
              S2C_EXPECTED_SHA="$(cat /root/expected-s2c.sha256)"
              S2C_ACTUAL_SHA="$(sha256sum /tmp/slow-download-32MiB.bin | awk '{print $1}')"
              if [ "$S2C_SIZE" = "33554432" ] && [ "$S2C_ACTUAL_SHA" = "$S2C_EXPECTED_SHA" ]; then
                pass "slow 32 MiB S2C download retained exact length and SHA-256"
              else
                fail "S2C slow download size/hash mismatch: size=$S2C_SIZE sha=$S2C_ACTUAL_SHA"
              fi
            else
              fail "S2C slow-reader download failed or exceeded its 420-second limit"
            fi
            S2C_FULL_COUNT="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            S2C_DRAINED_COUNT="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            S2C_NOT_DRAINED_COUNT="$(grep -c "SSH channel s2c buffer not drained at close" "$LOGDIR/ssh-core.log" 2>/dev/null || true)"
            echo "S2C full-buffer events: $S2C_FULL_COUNT"
            echo "S2C drained-buffer reports: $S2C_DRAINED_COUNT"
            echo "S2C not-drained reports: $S2C_NOT_DRAINED_COUNT"
            if [ "$S2C_FULL_COUNT" -gt "$S2C_FULL_BEFORE" ] && \
              [ "$S2C_DRAINED_COUNT" -gt "$S2C_DRAINED_BEFORE" ] && \
              [ "$S2C_NOT_DRAINED_COUNT" -eq 0 ]; then
              if grep "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core.log" | \
                sed -n 's/.*peak=\([0-9][0-9]*\)\/\([0-9][0-9]*\).*/\1 \2/p' | \
                awk '$1 > $2 || $1 != 131072 || $2 != 131072 { bad=1 } END { if (NR == 0 || bad) exit 1 }'; then
                pass "S2C ring buffer reached 128 KiB, then drained to zero after the client resumed reading"
              else
                fail "S2C ring-buffer capacity or peak report was invalid"
              fi
            else
              fail "S2C slow-reader backpressure did not fill and cleanly drain the 128 KiB ring buffer"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== CLIENT DISCONNECT / CHANNEL CLEANUP =========="
            curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
              --connect-timeout 10 --max-time 2 --limit-rate 2K \
              http://127.0.0.1:18080/abort-stream -o /tmp/abort-stream.bin
            ABORT_RC=$?
            if [ "$ABORT_RC" -eq 28 ]; then
              pass "client-side timeout closed an in-flight SOCKS channel as expected"
            else
              fail "abort-stream returned unexpected curl status $ABORT_RC"
            fi
            sleep 2
            if kill -0 "$APP_PID" 2>/dev/null && \
              curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
                --connect-timeout 15 --max-time 30 \
                http://127.0.0.1:18080/payload -o /tmp/post-abort.bin; then
              POST_ABORT_SHA="$(sha256sum /tmp/post-abort.bin | awk '{print $1}')"
              EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
              if [ "$POST_ABORT_SHA" = "$EXPECTED_SHA" ]; then
                pass "SSH core remained alive and a new SOCKS channel worked after client disconnect"
              else
                fail "post-disconnect SOCKS channel returned corrupted data"
              fi
            else
              fail "SSH core did not recover after a client-side disconnect"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== ABRUPT TCP RST ON IDLE READ-PENDING CHANNEL =========="
            RST_RSS_BEFORE="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
            RST_FD_BEFORE="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
            [ -n "$RST_RSS_BEFORE" ] || RST_RSS_BEFORE=0
            [ -n "$RST_FD_BEFORE" ] || RST_FD_BEFORE=0
            RST_ITER=1
            RST_LOOP_OK=1
            while [ "$RST_ITER" -le 33 ]; do
              if ! /root/socks-halfclose --rst-idle 1080; then
                RST_LOOP_OK=0
                break
              fi
              RST_ITER=$((RST_ITER + 1))
            done
            if [ "$RST_LOOP_OK" -eq 1 ]; then
              pass "33 idle SOCKS channels received explicit zero-linger TCP RSTs without exhausting MAX_CLIENTS=32"
            else
              fail "idle RST loop stopped at iteration $RST_ITER; possible zombie client slot"
            fi
            sleep 3
            RST_RSS_AFTER="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
            RST_FD_AFTER="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
            [ -n "$RST_RSS_AFTER" ] || RST_RSS_AFTER=0
            [ -n "$RST_FD_AFTER" ] || RST_FD_AFTER=0
            if [ "$RST_RSS_AFTER" -le $((RST_RSS_BEFORE + 1024)) ] && \
              [ "$RST_FD_AFTER" -le "$RST_FD_BEFORE" ] && kill -0 "$APP_PID" 2>/dev/null; then
              pass "idle RST cleanup left no material RSS/FD growth and daemon remained alive (RSS $RST_RSS_BEFORE->$RST_RSS_AFTER KiB; FD $RST_FD_BEFORE->$RST_FD_AFTER)"
            else
              fail "idle RST may have leaked client/channel state (RSS $RST_RSS_BEFORE->$RST_RSS_AFTER KiB; FD $RST_FD_BEFORE->$RST_FD_AFTER)"
            fi
            if curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
              --connect-timeout 15 --max-time 30 \
              http://127.0.0.1:18080/payload -o /tmp/post-rst.bin; then
              POST_RST_SHA="$(sha256sum /tmp/post-rst.bin | awk '{print $1}')"
              EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
              if [ "$POST_RST_SHA" = "$EXPECTED_SHA" ]; then
                pass "new SOCKS channel worked with exact SHA-256 after idle RST"
              else
                fail "post-RST SOCKS channel returned corrupted data"
              fi
            else
              fail "daemon did not accept a new SOCKS channel after idle RST"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== CONTINUOUS FOUR-WORKER STRESS (30 MINUTES) =========="
            STRESS_SECONDS=1800
            STRESS_END=$(( $(date +%s) + STRESS_SECONDS ))
            STRESS_EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
            STRESS_PIDS=""
            I=1
            while [ "$I" -le 4 ]; do
              (
                COUNT=0
                ERRORS=0
                while [ "$(date +%s)" -lt "$STRESS_END" ]; do
                  if curl -4 -fsS --socks5-hostname 127.0.0.1:1080 --connect-timeout 15 --max-time 30 http://127.0.0.1:18080/payload -o "/tmp/stress-$I.bin"; then
                    SIZE="$(wc -c <"/tmp/stress-$I.bin" | tr -d ' ')"
                    SHA="$(sha256sum "/tmp/stress-$I.bin" | awk '{print $1}')"
                    if [ "$SIZE" = "1048576" ] && [ "$SHA" = "$STRESS_EXPECTED_SHA" ]; then
                      COUNT=$((COUNT + 1))
                    else
                      ERRORS=$((ERRORS + 1))
                    fi
                  else
                    ERRORS=$((ERRORS + 1))
                  fi
                done
                printf '%s %s\n' "$COUNT" "$ERRORS" > "/tmp/stress-$I.result"
              ) &
              STRESS_PIDS="$STRESS_PIDS $!"
              I=$((I + 1))
            done

            RSS_BASE="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
            FD_BASE="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
            [ -n "$RSS_BASE" ] || RSS_BASE=0
            [ -n "$FD_BASE" ] || FD_BASE=0
            MAX_RSS="$RSS_BASE"
            MAX_FD="$FD_BASE"
            STRESS_ALIVE=1
            while [ "$(date +%s)" -lt "$STRESS_END" ]; do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                STRESS_ALIVE=0
                break
              fi
              CURRENT_RSS="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
              CURRENT_FD="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
              [ -n "$CURRENT_RSS" ] || CURRENT_RSS=0
              [ -n "$CURRENT_FD" ] || CURRENT_FD=0
              if [ "$CURRENT_RSS" -gt "$MAX_RSS" ]; then MAX_RSS="$CURRENT_RSS"; fi
              if [ "$CURRENT_FD" -gt "$MAX_FD" ]; then MAX_FD="$CURRENT_FD"; fi
              sleep 10
            done
            for STRESS_PID in $STRESS_PIDS; do
              wait "$STRESS_PID" || STRESS_ALIVE=0
            done

            STRESS_TOTAL=0
            STRESS_ERRORS=0
            I=1
            while [ "$I" -le 4 ]; do
              if [ -f "/tmp/stress-$I.result" ]; then
                read WORKER_COUNT WORKER_ERRORS < "/tmp/stress-$I.result"
                STRESS_TOTAL=$((STRESS_TOTAL + WORKER_COUNT))
                STRESS_ERRORS=$((STRESS_ERRORS + WORKER_ERRORS))
              else
                STRESS_ERRORS=$((STRESS_ERRORS + 1))
              fi
              I=$((I + 1))
            done
            echo "Stress downloads=$STRESS_TOTAL errors=$STRESS_ERRORS duration=$STRESS_SECONDS seconds workers=4"
            echo "Stress process RSS baseline=$RSS_BASE peak=$MAX_RSS KiB; FD baseline=$FD_BASE peak=$MAX_FD"
            if [ "$STRESS_ALIVE" -eq 1 ] && [ "$STRESS_TOTAL" -ge 20 ] && [ "$STRESS_ERRORS" -eq 0 ] &&
              [ "$MAX_RSS" -le $((RSS_BASE + 16384)) ] && [ "$MAX_FD" -le $((FD_BASE + 8)) ]; then
              pass "90-second four-worker stress completed with exact 1 MiB hashes and bounded RSS/FD usage"
            else
              fail "continuous stress errors, service exit, insufficient transfers, or resource growth detected"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== REPEATED CONNECTION / FD / RSS STABILITY =========="
            RSS_BEFORE="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
            FD_BEFORE="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
            I=1
            REPEAT_OK=1
            while [ "$I" -le 12 ]; do
              if ! curl -4 -fsS --socks5-hostname 127.0.0.1:1080 \
                --connect-timeout 15 --max-time 30 \
                http://127.0.0.1:18080/payload -o /dev/null; then
                REPEAT_OK=0
                break
              fi
              I=$((I + 1))
            done
            sleep 2
            RSS_AFTER="$(awk '/VmRSS:/ {print $2}' "/proc/$APP_PID/status" 2>/dev/null)"
            FD_AFTER="$(ls "/proc/$APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
            [ -n "$RSS_BEFORE" ] || RSS_BEFORE=0
            [ -n "$RSS_AFTER" ] || RSS_AFTER=0
            [ -n "$FD_BEFORE" ] || FD_BEFORE=0
            [ -n "$FD_AFTER" ] || FD_AFTER=0
            if [ "$REPEAT_OK" -eq 1 ] && [ "$RSS_AFTER" -le $((RSS_BEFORE + 16384)) ] && \
              [ "$FD_AFTER" -le $((FD_BEFORE + 4)) ]; then
              pass "12 repeated SOCKS connections completed without material RSS or FD growth (RSS $RSS_BEFORE->$RSS_AFTER KiB; FD $FD_BEFORE->$FD_AFTER)"
            else
              fail "repeated connections showed errors or possible RSS/FD growth (RSS $RSS_BEFORE->$RSS_AFTER KiB; FD $FD_BEFORE->$FD_AFTER)"
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== IDLE CHANNEL TIMEOUT MUST NOT RESTART OTHER ACTIVE CHANNELS =========="
            sed -e 's|^SOCKS_ADDR=.*$|SOCKS_ADDR=127.0.0.1:1081|' \
                -e 's|^IDLE_TIMEOUT=.*$|IDLE_TIMEOUT=3|' \
                /root/ssh-core-test.env > /root/ssh-core-idle-test.env
            "$BIN" -env /root/ssh-core-idle-test.env -log "$LOGDIR/ssh-core-idle.log" \
              >"$LOGDIR/ssh-core-idle-stdout.log" 2>&1 &
            IDLE_APP_PID=$!
            IDLE_START_COUNT=0
            while [ "$IDLE_START_COUNT" -lt 30 ]; do
              if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core-idle.log" 2>/dev/null; then
                break
              fi
              if ! kill -0 "$IDLE_APP_PID" 2>/dev/null; then
                break
              fi
              IDLE_START_COUNT=$((IDLE_START_COUNT + 1))
              sleep 1
            done

            if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core-idle.log" 2>/dev/null; then
              pass "second SSH core started with IDLE_TIMEOUT=3 on SOCKS port 1081"
              curl -4 -sS --socks5-hostname 127.0.0.1:1081 \
                --connect-timeout 10 --max-time 35 \
                http://127.0.0.1:18080/idle -o /tmp/idle-channel.bin \
                >"$LOGDIR/idle-curl.log" 2>&1 &
              IDLE_CURL_PID=$!
              sleep 1
              curl -4 -fsS --socks5-hostname 127.0.0.1:1081 \
                --connect-timeout 10 --max-time 35 \
                http://127.0.0.1:18080/idle-active -o /tmp/idle-active-6MiB.bin
              ACTIVE_RC=$?
              IDLE_CURL_RC=0
              wait "$IDLE_CURL_PID" || IDLE_CURL_RC=$?

              ACTIVE_SIZE="$(wc -c </tmp/idle-active-6MiB.bin 2>/dev/null | tr -d ' ')"
              ACTIVE_SHA="$(sha256sum /tmp/idle-active-6MiB.bin 2>/dev/null | awk '{print $1}')"
              EXPECTED_ACTIVE_SHA="$(cat /root/expected-idle-active.sha256)"
              if [ "$ACTIVE_RC" -eq 0 ] && [ "$ACTIVE_SIZE" = "6291456" ] && \
                [ "$ACTIVE_SHA" = "$EXPECTED_ACTIVE_SHA" ]; then
                pass "active 6 MiB stream completed with exact SHA-256 while the idle channel expired"
              else
                fail "active stream was interrupted by idle-channel cleanup: rc=$ACTIVE_RC size=$ACTIVE_SIZE sha=$ACTIVE_SHA"
              fi
              if [ "$IDLE_CURL_RC" -ne 0 ] && [ "$IDLE_CURL_RC" -ne 28 ]; then
                pass "idle SOCKS channel was closed independently"
              else
                fail "idle channel did not close independently (curl rc=$IDLE_CURL_RC)"
              fi
              if kill -0 "$IDLE_APP_PID" 2>/dev/null && \
                curl -4 -fsS --socks5-hostname 127.0.0.1:1081 \
                  --connect-timeout 10 --max-time 30 \
                  http://127.0.0.1:18080/payload -o /tmp/idle-post-cleanup.bin; then
                POST_CLEANUP_SHA="$(sha256sum /tmp/idle-post-cleanup.bin | awk '{print $1}')"
                EXPECTED_POST_SHA="$(cat /root/expected-payload.sha256)"
                if [ "$POST_CLEANUP_SHA" = "$EXPECTED_POST_SHA" ]; then
                  pass "idle-timeout cleanup left the second SSH daemon alive for a new SOCKS connection"
                else
                  fail "post-cleanup SOCKS transfer returned a bad SHA-256"
                fi
              else
                fail "idle-timeout cleanup stopped the daemon or prevented a new SOCKS connection"
              fi
            else
              fail "second SSH core did not start with IDLE_TIMEOUT=3"
              cat "$LOGDIR/ssh-core-idle-stdout.log" 2>/dev/null || true
              cat "$LOGDIR/ssh-core-idle.log" 2>/dev/null || true
            fi
            if [ -n "$IDLE_APP_PID" ]; then
              kill "$IDLE_APP_PID" 2>/dev/null || true
              wait "$IDLE_APP_PID" 2>/dev/null || true
            fi
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "========== TLS TRANSPORT / REMOTE EOF / 8 MiB POST-EOF UPLOAD =========="
            sed -e 's|^TRANSPORT=.*$|TRANSPORT=TLS|' \
                -e 's|^HOST_PORT=.*$|HOST_PORT=8443|' \
                -e 's|^SOCKS_ADDR=.*$|SOCKS_ADDR=127.0.0.1:1082|' \
                -e 's|^VERIFY_TLS=.*$|VERIFY_TLS=0|' \
                -e 's|^KEEPALIVE=.*$|KEEPALIVE=10|' \
                /root/ssh-core-test.env > /root/ssh-core-tls-test.env
            printf '%s\n' 'SNI=localhost' >> /root/ssh-core-tls-test.env
            "$BIN" -env /root/ssh-core-tls-test.env -log "$LOGDIR/ssh-core-tls.log" \
              >"$LOGDIR/ssh-core-tls-stdout.log" 2>&1 &
            TLS_APP_PID=$!
            TLS_START_COUNT=0
            while [ "$TLS_START_COUNT" -lt 40 ]; do
              if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core-tls.log" 2>/dev/null; then
                break
              fi
              if ! kill -0 "$TLS_APP_PID" 2>/dev/null; then
                break
              fi
              TLS_START_COUNT=$((TLS_START_COUNT + 1))
              sleep 1
            done

            if grep -q "SOCKS5 Listening" "$LOGDIR/ssh-core-tls.log" 2>/dev/null; then
              pass "TLS transport established SSH and opened SOCKS port 1082"

              echo "========== TLS KEEPALIVE WHILE THE SESSION IS IDLE =========="
              sleep 26
              TLS_KEEPALIVE_COUNT="$(grep -c "SSH keepalive sent" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
              echo "TLS keepalive success count while idle: $TLS_KEEPALIVE_COUNT"
              if [ "$TLS_KEEPALIVE_COUNT" -ge 2 ]; then
                pass "TLS SSH keepalives were transmitted repeatedly while no SOCKS channel was active"
              else
                fail "TLS SSH keepalive did not run repeatedly during idle time"
              fi

              if [ "$STATUS" -eq 0 ]; then
                echo "========== TLS 8 MiB UPLOAD WHILE S2C RING IS FULL =========="
                TLS_DUPLEX_FULL_BEFORE="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                TLS_DUPLEX_DRAIN_BEFORE="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                if /root/socks-halfclose --duplex /root/half-close-upload-8MiB.bin /tmp/tls-duplex-32MiB.bin 1082; then
                  TLS_DUPLEX_SIZE="$(wc -c </tmp/tls-duplex-32MiB.bin 2>/dev/null | tr -d ' ')"
                  TLS_DUPLEX_SHA="$(sha256sum /tmp/tls-duplex-32MiB.bin 2>/dev/null | awk '{print $1}')"
                  TLS_DUPLEX_EXPECTED_SHA="$(cat /root/expected-s2c.sha256)"
                  TLS_DUPLEX_FULL_AFTER="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                  TLS_DUPLEX_DRAIN_AFTER="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                  if [ "$TLS_DUPLEX_SIZE" = "33554432" ] && [ "$TLS_DUPLEX_SHA" = "$TLS_DUPLEX_EXPECTED_SHA" ] && \
                    [ "$TLS_DUPLEX_FULL_AFTER" -gt "$TLS_DUPLEX_FULL_BEFORE" ] && \
                    [ "$TLS_DUPLEX_DRAIN_AFTER" -gt "$TLS_DUPLEX_DRAIN_BEFORE" ]; then
                    pass "TLS full-duplex 8 MiB upload completed with exact 32 MiB response while S2C reached 128 KiB and drained"
                  else
                    fail "TLS full-duplex backpressure mismatch (size=$TLS_DUPLEX_SIZE sha=$TLS_DUPLEX_SHA full=$TLS_DUPLEX_FULL_BEFORE->$TLS_DUPLEX_FULL_AFTER drained=$TLS_DUPLEX_DRAIN_BEFORE->$TLS_DUPLEX_DRAIN_AFTER)"
                  fi
                else
                  fail "TLS full-duplex upload/S2C saturation helper failed"
                fi
              fi

              if [ "$STATUS" -eq 0 ]; then
                echo "========== TLS TWO-CHANNEL S2C BACKPRESSURE / SECOND CHANNEL CLOSE =========="
                TLS_TWO_FULL_BEFORE="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                TLS_TWO_DRAINED_BEFORE="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                TLS_TWO_NOT_DRAINED_BEFORE="$(grep -c "SSH channel s2c buffer not drained at close" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                curl -4 -fsS --socks5-hostname 127.0.0.1:1082 \
                  --connect-timeout 20 --max-time 180 --limit-rate 512K \
                  http://127.0.0.1:18080/slow-download -o /tmp/tls-slow-download-32MiB.bin \
                  >"$LOGDIR/tls-slow-download.log" 2>&1 &
                TLS_SLOW_PID=$!

                TLS_S2C_WAIT=0
                while [ "$TLS_S2C_WAIT" -lt 30 ]; do
                  TLS_TWO_FULL_NOW="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                  if [ "$TLS_TWO_FULL_NOW" -gt "$TLS_TWO_FULL_BEFORE" ]; then
                    break
                  fi
                  if ! kill -0 "$TLS_SLOW_PID" 2>/dev/null; then
                    break
                  fi
                  TLS_S2C_WAIT=$((TLS_S2C_WAIT + 1))
                  sleep 1
                done
                TLS_TWO_FULL_NOW="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                if [ "$TLS_TWO_FULL_NOW" -gt "$TLS_TWO_FULL_BEFORE" ]; then
                  pass "TLS slow-reader channel independently filled its S2C ring buffer"
                else
                  fail "TLS slow-reader channel did not reach S2C backpressure"
                fi

                TLS_IDLE_RC=0
                curl -4 -sS --socks5-hostname 127.0.0.1:1082 \
                  --connect-timeout 10 --max-time 12 \
                  http://127.0.0.1:18080/idle -o /dev/null \
                  >"$LOGDIR/tls-second-idle-channel.log" 2>&1 || TLS_IDLE_RC=$?
                if [ "$TLS_IDLE_RC" -eq 28 ]; then
                  pass "second TLS SOCKS channel was independently closed by its local reader timeout"
                else
                  fail "second TLS channel returned unexpected curl status $TLS_IDLE_RC"
                  cat "$LOGDIR/tls-second-idle-channel.log" 2>/dev/null || true
                fi

                echo "========== TLS IDLE READ-PENDING CLIENT RST DURING ACTIVE S2C =========="
                TLS_RST_RSS_BEFORE="$(awk '/VmRSS:/ {print $2}' "/proc/$TLS_APP_PID/status" 2>/dev/null)"
                TLS_RST_FD_BEFORE="$(ls "/proc/$TLS_APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
                [ -n "$TLS_RST_RSS_BEFORE" ] || TLS_RST_RSS_BEFORE=0
                [ -n "$TLS_RST_FD_BEFORE" ] || TLS_RST_FD_BEFORE=0
                if /root/socks-halfclose --rst-idle 1082; then
                  pass "idle TLS channel was reset with TCP RST while another TLS S2C channel was active"
                else
                  fail "TLS idle-channel RST helper failed"
                fi
                sleep 2
                TLS_RST_RSS_AFTER="$(awk '/VmRSS:/ {print $2}' "/proc/$TLS_APP_PID/status" 2>/dev/null)"
                TLS_RST_FD_AFTER="$(ls "/proc/$TLS_APP_PID/fd" 2>/dev/null | wc -l | tr -d ' ')"
                [ -n "$TLS_RST_RSS_AFTER" ] || TLS_RST_RSS_AFTER=0
                [ -n "$TLS_RST_FD_AFTER" ] || TLS_RST_FD_AFTER=0
                if [ "$TLS_RST_RSS_AFTER" -le $((TLS_RST_RSS_BEFORE + 1024)) ] && \
                  [ "$TLS_RST_FD_AFTER" -le "$TLS_RST_FD_BEFORE" ] && \
                  kill -0 "$TLS_APP_PID" 2>/dev/null && kill -0 "$TLS_SLOW_PID" 2>/dev/null; then
                  pass "TLS idle RST released its client resources without interrupting active S2C (RSS $TLS_RST_RSS_BEFORE->$TLS_RST_RSS_AFTER KiB; FD $TLS_RST_FD_BEFORE->$TLS_RST_FD_AFTER)"
                else
                  fail "TLS idle RST left leaked resources or interrupted the active S2C transfer"
                fi

                TLS_SLOW_RC=0
                wait "$TLS_SLOW_PID" || TLS_SLOW_RC=$?
                TLS_SLOW_SIZE="$(wc -c </tmp/tls-slow-download-32MiB.bin 2>/dev/null | tr -d ' ')"
                TLS_SLOW_SHA="$(sha256sum /tmp/tls-slow-download-32MiB.bin 2>/dev/null | awk '{print $1}')"
                TLS_EXPECTED_S2C_SHA="$(cat /root/expected-s2c.sha256)"
                if [ "$TLS_SLOW_RC" -eq 0 ] && [ "$TLS_SLOW_SIZE" = "33554432" ] && \
                  [ "$TLS_SLOW_SHA" = "$TLS_EXPECTED_S2C_SHA" ]; then
                  pass "TLS two-channel slow-reader transfer retained exact 32 MiB length and SHA-256"
                else
                  fail "TLS slow-reader transfer failed or changed after second-channel close (rc=$TLS_SLOW_RC size=$TLS_SLOW_SIZE sha=$TLS_SLOW_SHA)"
                fi

                TLS_S2C_FULL_COUNT="$(grep -c "SSH channel s2c buffer full" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                TLS_S2C_DRAINED_COUNT="$(grep -c "SSH channel s2c buffer drained after client resumed reading" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                TLS_S2C_NOT_DRAINED_COUNT="$(grep -c "SSH channel s2c buffer not drained at close" "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true)"
                if [ "$TLS_S2C_FULL_COUNT" -gt "$TLS_TWO_FULL_BEFORE" ] && \
                  [ "$TLS_S2C_DRAINED_COUNT" -gt "$TLS_TWO_DRAINED_BEFORE" ] && \
                  [ "$TLS_S2C_NOT_DRAINED_COUNT" -eq "$TLS_TWO_NOT_DRAINED_BEFORE" ]; then
                  pass "TLS S2C backpressure drained cleanly after the slow reader resumed"
                else
                  fail "TLS S2C backpressure did not report a clean drain after the two-channel test"
                fi
              fi

              if [ "$STATUS" -eq 0 ]; then
                if /root/socks-halfclose /root/half-close-upload-8MiB.bin 1082; then
                pass "TLS transport preserved both half-close directions and 8 MiB upload after remote EOF"
                else
                  fail "TLS transport half-close or 8 MiB post-EOF upload failed"
                  cat "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true
                fi
              fi
              if [ "$STATUS" -eq 0 ]; then
                if kill -0 "$TLS_APP_PID" 2>/dev/null && \
                  curl -4 -fsS --socks5-hostname 127.0.0.1:1082 \
                    --connect-timeout 10 --max-time 30 \
                    http://127.0.0.1:18080/payload -o /tmp/tls-post-halfclose.bin; then
                  TLS_POST_SHA="$(sha256sum /tmp/tls-post-halfclose.bin | awk '{print $1}')"
                  TLS_EXPECTED_SHA="$(cat /root/expected-payload.sha256)"
                  if [ "$TLS_POST_SHA" = "$TLS_EXPECTED_SHA" ]; then
                    pass "TLS SSH daemon remained usable after remote-EOF upload"
                  else
                    fail "TLS post-half-close transfer returned a bad SHA-256"
                  fi
                else
                  fail "TLS SSH daemon stopped or failed to accept a connection after TLS regression tests"
                fi
              fi
            else
              fail "TLS transport daemon did not reach SOCKS5 Listening"
              cat "$LOGDIR/ssh-core-tls-stdout.log" 2>/dev/null || true
              cat "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true
            fi
            if [ -n "$TLS_APP_PID" ]; then
              echo "========== TLS SIGTERM / GRACEFUL SSH AND TLS SHUTDOWN =========="
              kill -TERM "$TLS_APP_PID" 2>/dev/null || true
              TLS_EXIT_RC=0
              wait "$TLS_APP_PID" || TLS_EXIT_RC=$?
              TLS_APP_PID=
              if [ "$TLS_EXIT_RC" -eq 0 ] && \
                ! grep -q "A libssh2/OpenSSL operation is still pending at process shutdown" "$LOGDIR/ssh-core-tls.log" 2>/dev/null && \
                ! grep -q "Skipping libssh2 disconnect/free" "$LOGDIR/ssh-core-tls.log" 2>/dev/null && \
                ! grep -q "TLS close_notify did not complete before shutdown deadline" "$LOGDIR/ssh-core-tls.log" 2>/dev/null && \
                ! grep -q "libssh2_session_disconnect returned" "$LOGDIR/ssh-core-tls.log" 2>/dev/null && \
                ! grep -q "libssh2_session_free returned" "$LOGDIR/ssh-core-tls.log" 2>/dev/null; then
                pass "SIGTERM completed graceful SSH disconnect and TLS shutdown without pending-operation skip"
              else
                fail "SIGTERM did not complete graceful TLS shutdown (exit=$TLS_EXIT_RC)"
              fi
            fi
          fi

          echo "========== SSH CORE LOG =========="
          cat "$LOGDIR/ssh-core.log" 2>/dev/null || true
          echo "========== SSH CORE STDOUT =========="
          cat "$LOGDIR/ssh-core-stdout.log" 2>/dev/null || true
          echo "========== IDLE TEST SSH CORE LOG =========="
          cat "$LOGDIR/ssh-core-idle.log" 2>/dev/null || true
          echo "========== IDLE TEST SSH CORE STDOUT =========="
          cat "$LOGDIR/ssh-core-idle-stdout.log" 2>/dev/null || true
          echo "========== TLS TEST SSH CORE LOG =========="
          cat "$LOGDIR/ssh-core-tls.log" 2>/dev/null || true
          echo "========== TLS TEST SSH CORE STDOUT =========="
          cat "$LOGDIR/ssh-core-tls-stdout.log" 2>/dev/null || true
          if [ -n "$APP_PID" ]; then
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          fi
          echo "TEST STATUS: $STATUS" | tee "$LOGDIR/test-status" >/dev/console
          sync
          poweroff
          GUEST_TEST
          sudo chmod 0700 "$ROOT/root/run-passwall-ssh-core-test.sh"
          sudo sh -n "$ROOT/root/run-passwall-ssh-core-test.sh"

          sudo tee "$ROOT/etc/init.d/passwall-ssh-core-test" >/dev/null <<'GUEST_INIT'
          #!/bin/sh /etc/rc.common
          START=99
          start() {
            (
              sleep 8
              /root/run-passwall-ssh-core-test.sh 2>&1 | tee -a /root/ssh-core-test-logs/test.log /dev/console
            ) >/dev/console 2>&1 &
          }
          GUEST_INIT
          sudo chmod 0755 "$ROOT/etc/init.d/passwall-ssh-core-test"
          sudo mkdir -p "$ROOT/etc/rc.d"
          sudo ln -sf ../init.d/passwall-ssh-core-test "$ROOT/etc/rc.d/S99passwall-ssh-core-test"
          sudo tee "$ROOT/etc/rc.local" >/dev/null <<'GUEST_RC'
          #!/bin/sh
          exit 0
          GUEST_RC
          sudo chmod 0755 "$ROOT/etc/rc.local"
          sudo umount "$ROOT"

      - name: Boot OpenWrt 25.12.5 VM and run SOCKS / SSH channel tests
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/passwall-ssh-core-openwrt.exp <<'EXPECT'
          log_user 1
          log_file -a /tmp/passwall-ssh-core-openwrt-console.log
          set timeout 3600
          spawn qemu-system-x86_64 -machine accel=tcg -m 1024 -smp 4 \
            -kernel /tmp/openwrt-kernel.bin \
            -drive file=/tmp/openwrt-rootfs.img,format=raw,if=ide,index=0 \
            -append "root=/dev/sda rootfstype=ext4 rootwait rw console=ttyS0,115200" \
            -netdev user,id=net0 -device e1000,netdev=net0 -nographic -no-reboot
          set test_status ""
          expect {
            -re {Please press Enter to activate this console\.} { send "\r"; exp_continue }
            -re {TEST STATUS: ([0-9]+)} {
              set test_status $expect_out(1,string)
              exp_continue
            }
            timeout { puts "Timed out waiting for OpenWrt SSH core test."; exit 2 }
            eof {}
          }
          if {$test_status eq "0"} {
            puts "OpenWrt guest SSH core test passed; VM completed shutdown."
            exit 0
          }
          if {$test_status ne ""} {
            puts "OpenWrt guest SSH core test failed with status $test_status."
          } else {
            puts "OpenWrt VM stopped without reporting test status."
          }
          exit 2
          EXPECT
          expect /tmp/passwall-ssh-core-openwrt.exp

      - name: Verify host observed both half-close directions
        if: env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set -euo pipefail
          BOTH_HALFCLOSE_SEEN=0
          for attempt in $(seq 1 10); do
            CLIENT_FIN_COUNT="$(grep -cF "[HALFCLOSE] client FIN observed after complete request body" /tmp/ssh-core-http-server.log 2>/dev/null || true)"
            SERVER_FIN_COUNT="$(grep -cF "[HALFCLOSE] server FIN path received exact client trailer" /tmp/ssh-core-http-server.log 2>/dev/null || true)"
            LARGE_UPLOAD_COUNT="$(grep -cF "[HALFCLOSE-LARGE] PASS received exact 8388608-byte upload SHA-256=" /tmp/ssh-core-http-server.log 2>/dev/null || true)"
            DUPLEX_UPLOAD_COUNT="$(grep -cF "[DUPLEX] PASS upload=8388608 SHA-256=" /tmp/ssh-core-http-server.log 2>/dev/null || true)"
            if [ "$CLIENT_FIN_COUNT" -ge 2 ] &&
              [ "$SERVER_FIN_COUNT" -ge 2 ] &&
              [ "$LARGE_UPLOAD_COUNT" -ge 2 ] &&
              [ "$DUPLEX_UPLOAD_COUNT" -ge 2 ]; then
              BOTH_HALFCLOSE_SEEN=1
              break
            fi
            sleep 1
          done
          echo "client-FIN-first observations: $CLIENT_FIN_COUNT"
          echo "server-FIN-first observations: $SERVER_FIN_COUNT"
          echo "exact 8 MiB post-EOF uploads: $LARGE_UPLOAD_COUNT"
          echo "full-duplex exact 8 MiB uploads with 32 MiB S2C responses: $DUPLEX_UPLOAD_COUNT"
          test "$BOTH_HALFCLOSE_SEEN" -eq 1
          echo "TCP and TLS half-close and full-duplex S2C backpressure uploads were verified by the host HTTP fixture."
          TLS_CLOSE_NOTIFY_COUNT="$(grep -cF "[TLS-RELAY] close_notify exchange completed" /tmp/ssh-core-tls-relay.log 2>/dev/null || true)"
          echo "TLS relay close_notify exchanges completed: $TLS_CLOSE_NOTIFY_COUNT"
          test "$TLS_CLOSE_NOTIFY_COUNT" -ge 1
          echo "TLS relay acknowledged the guest's graceful close_notify during SIGTERM shutdown."

      - name: Collect OpenWrt guest logs and build manifests
        if: always() && env.TEST_STAGE == 'vm'
        shell: bash
        run: |
          set +e
          mkdir -p test-results/openwrt-guest
          if mountpoint -q /mnt/openwrt-root; then sudo umount /mnt/openwrt-root; fi
          if [ -f /tmp/openwrt-rootfs.img ]; then sudo e2fsck -fy /tmp/openwrt-rootfs.img; fi
          if [ -f /tmp/openwrt-rootfs.img ] && sudo mount -o loop,ro /tmp/openwrt-rootfs.img /mnt/openwrt-root; then
            sudo cp -a /mnt/openwrt-root/root/ssh-core-test-logs/. test-results/openwrt-guest/ 2>/dev/null
            sudo cp -a /mnt/openwrt-root/root/ssh-core-test.env test-results/openwrt-guest/ 2>/dev/null
            sudo umount /mnt/openwrt-root
          fi
          cp /tmp/passwall-ssh-core-openwrt-console.log test-results/openwrt-qemu-console.log 2>/dev/null
          cp /tmp/ssh-core-sshd.log test-results/host-sshd.log 2>/dev/null
          cp /tmp/ssh-core-http-server.log test-results/host-http-server.log 2>/dev/null
          cp /tmp/ssh-core-tls-relay.log test-results/host-tls-relay.log 2>/dev/null
          cp /tmp/ssh-core-tcp-buffers.log test-results/host-tcp-buffers.log 2>/dev/null
          sha256sum ssh-core.c > test-results/ssh-core-source.sha256
          ls -lh test-results test-results/openwrt-guest || true

      - name: Upload OpenWrt guest test logs
        if: always() && env.TEST_STAGE == 'vm'
        uses: actions/upload-artifact@v4
        with:
          name: passwall-ssh-core-openwrt-25.12.5-x86_64-vm
          path: |
            test-results/**
          if-no-files-found: warn
          retention-days: 14
